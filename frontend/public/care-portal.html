          <section class="card a-teal" aria-labelledby="h-shared"><h2 id="h-shared">Patients via QR / consent</h2>
            <p class="small muted">Temporary, read-only access. It ends after 30 minutes unless you add a visit or prescription, which makes the patient yours.</p>
            ${shared.length ? `<ul class="list">${shared.map((g) => { const p = PATIENTS.get(g.abha); const live = g.expiresAt > now(); return `<li><div class="row">
              <div><p><strong>${esc(p.name)}</strong> <span class="tag">${esc(g.method)}</span></p>
              <p class="small muted">${live ? `Expires ${fmtTime(g.expiresAt)} · <span data-countdown="${g.expiresAt}">${Math.ceil((g.expiresAt - now()) / MIN)} min left</span>` : `Expired at ${fmtTime(g.expiresAt)}`}</p></div>
              ${live ? `<a class="btn btn-ghost btn-sm" href="#/doctor/patient/${esc(p.abha)}">Open<span class="visually-hidden"> ${esc(p.name)}</span></a>` : '<span class="tag">Expired</span>'}</div></li>`; }).join('')}</ul>` : empty('No temporary access right now.')}</section>
          <details class="card"><summary>My hospital (read-only)</summary>
            <dl class="kv"><dt>Name</dt><dd>${esc(h.name)}</dd><dt>Registration ID</dt><dd>${esc(h.regId)}</dd><dt>Address</dt><dd>${esc(h.address)}</dd><dt>Contact</dt><dd>${esc(h.contact)}</dd>
            <dt>Departments</dt><dd>${h.departments.map(esc).join(', ')}</dd><dt>Beds</dt><dd>${h.beds}</dd></dl></details>
        </div>
        <div class="stack">
          <section class="card a-sky" aria-labelledby="h-scan"><h2 id="h-scan">Scan QR / Enter token</h2><p class="small"><strong>Access is logged.</strong></p>
            <form data-form="token" novalidate><label>Patient token<span class="hint">Type or paste the token printed under the patient's QR code</span><input name="token" autocomplete="off" placeholder="NSQR-…" required></label>
            <p class="form-error" role="alert" hidden></p><div class="form-actions"><button class="btn btn-primary">Verify token</button></div></form></section>
          <section class="card a-teal" aria-labelledby="h-consent"><h2 id="h-consent">Open with patient consent</h2>
            <p class="small muted">The patient reads out the one-time code sent to their phone. Access is logged.</p>
            <form data-form="consent" novalidate><label>Patient ABHA ID<input name="abha" inputmode="numeric" placeholder="XX-XXXX-XXXX-XXXX" autocomplete="off" required></label>
            <label>Patient consent OTP<span class="hint">Demo OTP: ${DEMO_OTP}</span><input name="otp" inputmode="numeric" maxlength="6" autocomplete="off" required></label>
            <p class="form-error" role="alert" hidden></p><div class="form-actions"><button class="btn btn-primary">Open record</button></div></form></section>
        </div></div>
      <div class="grid grid-2 section-gap">
          <section class="card a-violet" aria-labelledby="h-elig"><h2 id="h-elig">Check insurance eligibility</h2>
            <p class="small muted">Uses the same rules as the patient record. Checks for a patient are logged in their access log.</p>
            <form data-form="elig" novalidate>${icdDatalist()}
              <label>System<select name="system"><option value="ICD">ICD (modern medicine)</option><option value="AYUSH">AYUSH treatment</option></select></label>
              <div data-for="AYUSH" hidden><label>AYUSH system<select name="ayushSystem">${INSURANCE_RULES.ayushSystems.map((s) => `<option>${esc(s)}</option>`).join('')}</select></label></div>
              <label>ICD code or AYUSH treatment name<input name="code" list="icd-codes" placeholder="E11, N39.0 or Panchakarma" autocomplete="off" required></label>
              <label>Patient (optional)<span class="hint">Only patients you can open: assigned, or via QR / consent</span><select name="patient"><option value="">No patient: check the rule only</option>
                ${[...PATIENTS.values()].filter((p) => access(doc, p)).map((p) => `<option value="${esc(p.abha)}">${esc(p.name)} (${esc(p.abha)})</option>`).join('')}</select></label>
              <p class="form-error" role="alert" hidden></p><div class="form-actions"><button class="btn btn-ghost">Check eligibility</button></div></form>
            <div id="elig-result" aria-live="polite"></div></section>
        <div class="stack">
          <section class="card a-indigo" aria-labelledby="h-check"><h2 id="h-check">Check ABHA ID</h2>
            <p class="small muted">Checks the format and whether the ID is registered. No medical data is shown.</p>
            <form data-form="check" novalidate><label>ABHA ID<input name="abha" inputmode="numeric" placeholder="XX-XXXX-XXXX-XXXX" autocomplete="off" required></label>
            <div class="form-actions"><button class="btn btn-ghost">Check</button></div></form><div id="check-result" aria-live="polite"></div></section>
          <section class="card a-amber no-print" aria-labelledby="h-clock"><h2 id="h-clock">Demo clock</h2>
            <p class="small muted">For reviewers: move time forward to see 30-minute access expire. ${clockOffset ? `Clock is ahead by ${Math.round(clockOffset / MIN)} min.` : 'Clock shows real time.'}</p>
            <div class="form-actions"><button class="btn btn-ghost btn-sm" data-action="clock" data-min="31">Advance 31 minutes</button>${clockOffset ? '<button class="btn btn-ghost btn-sm" data-action="clock" data-min="0">Reset clock</button>' : ''}</div></section>
        </div></div>`;
  }

  function noAccess(abha) {
    const doc = currentDoctor();
    const expired = grants.filter((g) => g.doctorId === doc.id && g.abha === abha).pop();
    return `<div class="narrow"><section class="card"><h1>No access to this record</h1>
      ${expired ? `<div class="banner warn">Your ${esc(expired.method)} access ended at ${fmtTime(expired.expiresAt)}.</div>` : ''}
      <p>This patient is not assigned to you. To open their record, ask them to show their QR code or to share the consent OTP sent to their phone.</p>
      <div class="form-actions"><a class="btn btn-primary" href="#/doctor">Back to dashboard</a></div></section></div>`;
  }

  function recordHead(p, doc, acc, tab) {
    const banner = acc.kind === 'assigned'
      ? `<div class="banner ok">Your patient. Seen by you at ${esc(HOSPITALS[doc.hospitalId].short)}.</div>`
      : `<div class="banner warn">Temporary access via <strong>${esc(acc.grant.method)}</strong>: history and reports are read-only until <strong>${fmtTime(acc.grant.expiresAt)}</strong> (<span data-countdown="${acc.grant.expiresAt}">${Math.ceil((acc.grant.expiresAt - now()) / MIN)} min left</span>). This visit is logged. Adding a visit or prescription links this patient to you and ${esc(HOSPITALS[doc.hospitalId].short)}.</div>`;
    const t = (id, label, href) => `<a class="tab" href="${href}"${tab === id ? ' aria-current="page"' : ''}>${label}</a>`;
    return `<p class="no-print"><a class="link" href="#/doctor">← Back to dashboard</a></p>
      ${welcome({ eyebrow: 'Patient record', title: p.name, sub: `ABHA ID ${esc(p.abha)} · ${p.age} · ${esc(p.gender)}`,
        action: `<a class="btn btn-primary" href="#/doctor/report/${esc(p.abha)}">Generate Final Report</a>` })}
      ${banner}
      <nav class="tabs no-print" aria-label="Patient record sections">${t('record', 'Record', `#/doctor/patient/${esc(p.abha)}`)}${t('summary', 'Clinical summary', `#/doctor/summary/${esc(p.abha)}`)}${t('insurance', 'Insurance', `#/doctor/insurance/${esc(p.abha)}`)}</nav>`;
  }

  function viewDoctorSummary(abha, ctx) {
    const doc = currentDoctor();
    const p = PATIENTS.get(abha);
    const acc = access(doc, p);
    if (!acc) return noAccess(abha);
    if (ctx.nav) logAccess(p, doc, acc); // a deep link here is an access like opening the record
    // Any doctor with access may set the AYUSH diagnosis; temporary access stays read-only for history.
    return `${recordHead(p, doc, acc, 'summary')}${clinicalSummary(p, true, 'd-summary')}`;
  }

  function viewDoctorInsurance(abha, ctx) {
    const doc = currentDoctor();
    const p = PATIENTS.get(abha);
    const acc = access(doc, p);
    if (!acc) return noAccess(abha);
    if (ctx.nav) logEligibility(p, doc, `Insurance tab: ${insuranceEntries(p).length} entries checked`);
    return `${recordHead(p, doc, acc, 'insurance')}<div class="grid grid-2"><div class="stack">${insuranceCard(p, 'd-insurance')}</div>
      <div class="stack">${diagnosisCard(p)}</div></div>`;
  }

  function viewDoctorPatient(abha, ctx) {
    const doc = currentDoctor();
    const p = PATIENTS.get(abha);
    const acc = access(doc, p);
    if (!acc) return noAccess(abha);
    if (ctx.nav) logAccess(p, doc, acc);
    const active = p.meds.filter((m) => m.status === 'active');
    const warnings = medWarnings(p, active);
    const assigned = acc.kind === 'assigned';
    const brands = `<datalist id="brands">${Object.keys(CAT).map((b) => `<option value="${esc(b)}">`).join('')}</datalist>`;
    return `${recordHead(p, doc, acc, 'record')}${icdDatalist()}
      <div class="grid grid-2">
        <div class="stack">${profileCard(p)}${diagnosisCard(p)}
          ${warnings.length ? `<section class="card a-amber" aria-labelledby="h-warn"><h2 id="h-warn">Medicine warnings</h2><div class="banner warn" style="margin:0"><ul class="warn-list">${warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></div></section>` : ''}
          ${newMedsCard(active.filter(isNewMed))}${medsCard(active, { stop: assigned, abha: p.abha })}${timelineCard(p)}</div>
        <div class="stack">
          <section class="card a-indigo" aria-labelledby="h-note"><h2 id="h-note">Add visit, diagnosis, treatment or note</h2>
            <form data-form="note" data-abha="${esc(p.abha)}" novalidate>
              <label>Entry type<select name="kind"><option>Visit</option><option>Diagnosis</option><option>Treatment</option><option>Note</option></select></label>
              <label>New diagnosis<span class="hint">Required for a diagnosis entry; replaces the current diagnosis</span><input name="diagnosis" autocomplete="off"></label>
              <label>Notes<textarea name="text" required></textarea></label>
              ${codingFields(p, { kind: 'note' })}
              <p class="form-error" role="alert" hidden></p><div class="form-actions"><button class="btn btn-primary">Save entry</button></div></form></section>
          <section class="card a-teal" aria-labelledby="h-rx"><h2 id="h-rx">Add prescription</h2>
            <form data-form="prescribe" data-abha="${esc(p.abha)}" novalidate>${brands}
              <label>Brand name<span class="hint">Pick from the list to fill in the salt automatically</span><input name="brand" list="brands" autocomplete="off" required></label>
              <label>Salt / composition<span class="hint">e.g. Ibuprofen 400 mg + Paracetamol 325 mg</span><input name="salt" autocomplete="off" required></label>
              <div class="row2"><label>Dose<input name="dose" placeholder="1 tablet" autocomplete="off" required></label>
              <label>Frequency<input name="frequency" placeholder="Twice daily after food" autocomplete="off" required></label></div>
              <label>Duration<input name="duration" placeholder="5 days" autocomplete="off" required></label>
              <label>Side-effect notes<span class="hint">Only needed for brands not in the demo list</span><input name="senote" autocomplete="off"></label>
              ${codingFields(p, { code: p.dxCode && p.dxCode.system === 'ICD' ? p.dxCode.code : '' })}
              <div class="rx-warnings" aria-live="polite"></div>
              <label class="rx-ack" hidden><input type="checkbox" name="ack"> I have reviewed these warnings and still want to prescribe</label>
              <p class="form-error" role="alert" hidden></p><div class="form-actions"><button class="btn btn-primary">Save prescription</button></div></form></section>
          ${reportsCard(p, { owner: false })}
        </div></div>`;
  }

  function medTable(list, { stopped = false } = {}) {
    if (!list.length) return empty(stopped ? 'No discontinued medicines.' : 'None.');
    const head = stopped
      ? '<tr><th>Brand</th><th>Salt / composition</th><th>Strength</th><th>Stopped on</th><th>Stopped by</th><th>Reason</th></tr>'
      : '<tr><th>Brand</th><th>Salt / composition</th><th>Strength</th><th>Dose</th><th>Frequency</th><th>Duration</th><th>Side-effect notes</th><th>Prescribed at</th></tr>';
    const seNote = (m) => (m.se ? [m.se.common && m.se.common.length ? 'Common: ' + m.se.common.join(', ') + '.' : '', m.se.serious && m.se.serious.length ? 'Serious: ' + m.se.serious.join(', ') + '.' : '', m.se.contact ? 'Contact doctor if ' + m.se.contact : ''].filter(Boolean).join(' ') : '—');
    const rows = list.map((m) => (stopped
      ? `<tr><td>${esc(m.brand)}</td><td>${esc(saltNames(m))}</td><td>${esc(strengths(m))}</td><td>${fmtDate(m.stoppedAt)}</td><td>${esc(DOCTOR[m.stoppedBy].name)}, ${esc(HOSPITALS[DOCTOR[m.stoppedBy].hospitalId].short)}</td><td>${esc(m.stopReason || '—')}</td></tr>`
      : `<tr><td><strong>${esc(m.brand)}</strong></td><td>${esc(saltNames(m))}</td><td>${esc(strengths(m))}</td><td>${esc(m.dose)}</td><td>${esc(m.frequency)}</td><td>${esc(m.duration)}</td><td class="small">${esc(seNote(m))}</td><td class="small">${esc(DOCTOR[m.doctorId].name)}, ${esc(HOSPITALS[m.hospitalId].short)}, ${fmtDate(m.start)}</td></tr>`)).join('');
    return `<div class="table-wrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
  }

  function reportHtml(p, doc, issuedAt) {
    const h = HOSPITALS[doc.hospitalId];
    const active = p.meds.filter((m) => m.status === 'active');
    const warnings = medWarnings(p, active);
    return `<p class="eyebrow">Final report · demo, fictional data</p><h1>Final report: ${esc(p.name)}</h1><p class="muted">Issued ${fmtDateTime(issuedAt)} at ${esc(h.name)}</p>
      <div class="report-grid">
        <div><h2>Patient</h2><dl class="kv"><dt>Name</dt><dd>${esc(p.name)}</dd><dt>Age / gender</dt><dd>${p.age} / ${esc(p.gender)}</dd><dt>ABHA ID</dt><dd>${esc(p.abha)}</dd><dt>Blood group</dt><dd>${esc(p.blood)}</dd><dt>Allergies</dt><dd>${p.allergies.length ? p.allergies.map(esc).join(', ') : 'None recorded'}</dd></dl></div>
        <div><h2>Issued by</h2><dl class="kv"><dt>Doctor</dt><dd>${esc(doc.name)}</dd><dt>Speciality</dt><dd>${esc(doc.spec)}</dd><dt>HPR ID</dt><dd>${esc(doc.hprId)}</dd><dt>Hospital</dt><dd>${esc(h.name)}</dd><dt>Registration ID</dt><dd>${esc(h.regId)}</dd><dt>Address</dt><dd>${esc(h.address)}</dd></dl></div>
      </div>
      <h2>Diagnosis</h2><p style="font-weight:650">${esc(p.diagnosis)}</p>
      <h2>Medicine safety checks</h2>
      ${warnings.length ? `<div class="banner warn"><ul class="warn-list">${warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '<p>The demo checks found no duplicate salts and no conflicts with the listed allergies. This is not a full drug-interaction check.</p>'}
      <h2>Current medicines</h2>${medTable(active)}
      <h2>Newly added medicines (last 30 days)</h2>${medTable(active.filter(isNewMed))}
      <h2>Discontinued medicines</h2>${medTable(p.meds.filter((m) => m.status === 'stopped'), { stopped: true })}
      <h2>Insurance eligibility</h2>
      ${p.policy ? `<p>${esc(p.policy.insurer)} · policy ${esc(p.policy.number)} · valid ${fmtDate(p.policy.validFrom)} to ${fmtDate(p.policy.validTo)} · ${policyStatusOn(p.policy, issuedAt)} on the report date</p>` : `<p><strong>${esc(INSURANCE_RULES.messages.noPolicy)}</strong></p>`}
      ${insuranceEntries(p).length ? `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Entry</th><th>System</th><th>ICD code / AYUSH treatment</th><th>Result</th></tr></thead><tbody>
      ${insuranceEntries(p).map((e) => { const r = evaluateEligibility(e, { policy: p.policy, date: e.date }); return `<tr><td>${fmtDate(e.date)}</td><td>${esc(e.type)}: ${esc(e.title)}<br><span class="small muted">${esc(HOSPITALS[e.hospitalId].short)}</span></td>
        <td>${e.system === 'AYUSH' ? `AYUSH (${esc(e.ayushSystem)})` : esc(icdEdition(e.code) || 'ICD')}</td><td>${esc(e.code || 'No code yet')}${e.system === 'ICD' && e.code ? `<br><span class="small muted">${esc(icdDescription(e.code) || 'unrecognised code')}</span>` : ''}</td>
        <td>${badge(r)}<br><span class="small">${esc(r.reason)}</span></td></tr>`; }).join('')}</tbody></table></div>` : empty('No coded entries.')}
      <p class="small muted">${esc(INSURANCE_RULES.note)}</p>
      <p class="sig">Signature: ______________________ &nbsp; ${esc(doc.name)}, ${esc(h.name)}</p>
      <p class="small muted">Demo only, not for real medical use. All data is fictional.</p>`;
  }

  function viewReport(abha, ctx) {
    const doc = currentDoctor();
    const p = PATIENTS.get(abha);
    const acc = access(doc, p);
    if (!acc) return noAccess(abha);
    if (ctx.nav) logEligibility(p, doc, `Final report: ${insuranceEntries(p).length} entries checked`);
    return `<div class="no-print"><p><a class="link" href="#/doctor/patient/${esc(p.abha)}">← Back to ${esc(p.name)}</a></p>
      <div class="form-actions" style="margin:0 0 1.25rem"><button class="btn btn-primary" data-action="print">Print / Save as PDF</button>
      ${acc.kind === 'assigned' ? `<button class="btn btn-ghost" data-action="save-final" data-abha="${esc(p.abha)}">Save to patient timeline</button>` : '<p class="small muted">To save the report to the timeline, first add a visit or prescription so the patient is linked to you.</p>'}</div></div>
      <article class="card report" id="final-report">${reportHtml(p, doc, now())}</article>`;
  }

  function viewVerify(token) {
    const p = [...PATIENTS.values()].find((x) => x.qrToken && x.qrToken === token.toUpperCase());
    if (!p) return `<div class="narrow"><section class="card"><h1>Token not valid</h1><div class="banner err">This token does not work. The patient may have revoked it or generated a new one.</div>
      <div class="form-actions"><a class="btn btn-primary" href="#/doctor">Back to dashboard</a></div></section></div>`;
    return `<div class="narrow"><section class="card"><p class="eyebrow">QR token check</p><h1>Verify &amp; View History</h1>
      <p>This token belongs to a registered patient. Opening it gives you <strong>30 minutes of read-only access</strong> to their history and reports.</p>
      <p class="small"><strong>Access is logged</strong> and the patient can see it in their access log.</p>
      <div class="form-actions"><button class="btn btn-primary" data-action="verify-token" data-token="${esc(token.toUpperCase())}">Verify &amp; View History</button><a class="btn btn-ghost" href="#/doctor">Cancel</a></div></section></div>`;
  }

  const notFound = () => `<div class="narrow"><section class="card"><h1>Page not found</h1><p><a class="link" href="${homeHash()}">Go back</a></p></section></div>`;

  /* ---------- router: every view checks the signed-in role before it renders ---------- */
  const ROUTES = [
    { re: /^\/?$/, view: viewLanding },
    { re: /^\/login\/(patient|doctor|hospital)$/, view: viewLogin },
    { re: /^\/patient$/, role: 'patient', view: viewPatient },
    { re: /^\/hospital$/, role: 'hospital', view: viewHospital },
    { re: /^\/hospital\/doctor\/([A-Za-z0-9]+)$/, role: 'hospital', view: viewHospitalDoctor },
    { re: /^\/doctor$/, role: 'doctor', view: viewDoctor },
    { re: /^\/doctor\/patient\/([\d-]+)$/, role: 'doctor', view: viewDoctorPatient },
    { re: /^\/doctor\/report\/([\d-]+)$/, role: 'doctor', view: viewReport },
    { re: /^\/doctor\/insurance\/([\d-]+)$/, role: 'doctor', view: viewDoctorInsurance },
    { re: /^\/doctor\/summary\/([\d-]+)$/, role: 'doctor', view: viewDoctorSummary },
    { re: /^\/verify\/([A-Za-z0-9-]+)$/, role: 'doctor', keep: true, view: viewVerify },
  ];

  function flash(text, kind = 'ok') {
    flashBox.innerHTML = `<div class="banner ${kind}">${esc(text)}</div>`;
    flashBox.dataset.keep = '1'; // survive the next page change
  }
  function go(hash) {
    if (location.hash === hash) render(true);
    else location.hash = hash;
  }
  function render(nav = false) {
    if (session && Date.now() - lastActivity > IDLE_LIMIT) return endSession(true);
    let path;
    try { path = decodeURIComponent((location.hash || '#/').slice(1)) || '/'; } catch { path = '/404'; }
    let route = null, params = [];
    for (const r of ROUTES) { const m = path.match(r.re); if (m) { route = r; params = m.slice(1); break; } }
    if (route && route.role && (!session || session.role !== route.role)) {
      if (route.keep) afterLogin = '#' + path;
      flash(`Please sign in as a ${ROLE_LABEL[route.role].toLowerCase()} to open that page.`, 'warn');
      history.replaceState(null, '', `#/login/${route.role}`);
      return render(true);
    }
    if (nav && !flashBox.dataset.keep) flashBox.innerHTML = '';
    delete flashBox.dataset.keep;
    app.innerHTML = route ? route.view(...params, { nav }) : notFound();
    renderSession();
    if (route && route.view === viewPatient) drawQr(currentPatient());
    hydrateSummary();
    if (nav) {
      window.scrollTo(0, 0);
      const h1 = app.querySelector('h1');
      if (h1) { h1.tabIndex = -1; h1.focus({ preventScroll: true }); }
    }
  }
  function renderSession() {
    const box = document.getElementById('session');
    box.innerHTML = `${session ? `<span>Signed in: <strong>${esc(sessionName())}</strong> <span class="tag">${ROLE_LABEL[session.role]}</span></span>
      <a class="btn btn-ghost btn-sm" href="${homeHash()}">Dashboard</a><button class="btn btn-ghost btn-sm" data-action="logout">Sign out</button>` : ''}
      <button class="btn btn-ghost btn-sm" data-action="theme" aria-pressed="${theme === 'dark'}">${theme === 'dark' ? 'Light mode' : 'Dark mode'}</button>`;
  }
  function endSession(timedOut) {
    const role = session && session.role;
    session = null;
    afterLogin = null;
    if (timedOut) {
      flash('Your session timed out after 10 minutes without activity. Please sign in again.', 'warn');
      flashBox.dataset.keep = '1';
      history.replaceState(null, '', role ? `#/login/${role}` : '#/');
      render(true);
    }
  }
  function drawQr(p) {
    const el = document.getElementById('qr');
    if (!el || !p || !p.qrToken) return;
    if (typeof window.QRCode !== 'function') {
      el.innerHTML = '<p class="small" style="color:#333">The QR library could not load (offline?). Share the token text below instead.</p>';
      return;
    }
    new window.QRCode(el, { text: p.qrToken, width: 184, height: 184, colorDark: '#000000', colorLight: '#ffffff', correctLevel: window.QRCode.CorrectLevel.M });
    el.removeAttribute('title');
    el.querySelectorAll('img').forEach((img) => { img.alt = ''; }); // the wrapper carries role="img" and the label
  }

  /* ---------- form handlers ---------- */
  function formError(form, msg, field) {
    form.querySelectorAll('[aria-invalid]').forEach((x) => x.removeAttribute('aria-invalid'));
    const box = form.querySelector('.form-error');
    box.textContent = msg;
    box.hidden = false;
    if (field && form.elements[field]) { form.elements[field].setAttribute('aria-invalid', 'true'); form.elements[field].focus(); }
  }
  const val = (form, name) => String(form.elements[name].value || '').trim();
  function doctorWithAccess(abha) {
    const doc = currentDoctor();
    const p = PATIENTS.get(abha);
    const acc = access(doc, p);
    if (!acc) {
      flash(doc ? 'Your access to this record has ended.' : 'Please sign in as a doctor.', 'warn');
      go(doc ? '#/doctor' : '#/login/doctor');
      return null;
    }
    return { doc, p, acc };
  }

  const FORMS = {
    login(form) {
      const role = form.dataset.role;
      const id = val(form, 'id'), secret = val(form, 'secret');
      if (!id) return formError(form, 'Enter your ID.', 'id');
      if (!secret) return formError(form, role === 'patient' ? 'Enter the OTP.' : 'Enter your password.', 'secret');
      let next = null;
      if (role === 'patient') {
        const abha = normAbha(id);
        if (!ABHA_RE.test(abha)) return formError(form, 'ABHA ID must look like 12-3456-7890-1234 (14 digits).', 'id');
        if (!PATIENTS.has(abha)) return formError(form, 'No patient record uses this ABHA ID.', 'id');
        if (secret !== DEMO_OTP) return formError(form, 'That OTP is incorrect.', 'secret');
        next = { role, id: abha };
      } else if (role === 'doctor') {
        const d = DOCTORS.find((x) => x.hprId.toLowerCase() === id.toLowerCase() || x.abha === normAbha(id));
        if (!d || d.password !== secret) return formError(form, 'The ID or password is incorrect.', 'id');
        next = { role, id: d.id };
      } else {
        const h = Object.values(HOSPITALS).find((x) => x.regId.toLowerCase() === id.toLowerCase());
        if (!h || h.password !== secret) return formError(form, 'The registration ID or password is incorrect.', 'id');
        next = { role, id: h.id };
      }
      session = next;
      lastActivity = Date.now();
      const target = role === 'doctor' && afterLogin ? afterLogin : `#/${role}`;
      afterLogin = null;
      flash(`Signed in as ${sessionName()}.`);
      flashBox.dataset.keep = '1';
      go(target);
    },
    token(form) {
      if (!currentDoctor()) return go('#/login/doctor');
      const t = val(form, 'token').toUpperCase();
      if (!t) return formError(form, 'Enter the token.', 'token');
      if (!/^[A-Z0-9-]+$/.test(t)) return formError(form, 'A token contains only letters, numbers and dashes.', 'token');
      go(`#/verify/${t}`);
    },
    consent(form) {
      const doc = currentDoctor();
      if (!doc) return go('#/login/doctor');
      const abha = normAbha(val(form, 'abha'));
      if (!ABHA_RE.test(abha)) return formError(form, 'ABHA ID must look like 12-3456-7890-1234 (14 digits).', 'abha');
      const p = PATIENTS.get(abha);
      if (!p) return formError(form, 'No patient record uses this ABHA ID.', 'abha');
      if (val(form, 'otp') !== DEMO_OTP) return formError(form, 'The consent OTP is incorrect. Ask the patient to read it again.', 'otp');
      if (!p.assigned.includes(doc.id)) grantAccess(doc, p, 'Consent OTP');
      go(`#/doctor/patient/${abha}`);
    },
    check(form) {
      if (!currentDoctor()) return go('#/login/doctor');
      const out = document.getElementById('check-result');
      const raw = val(form, 'abha');
      const abha = normAbha(raw);
      form.elements.abha.removeAttribute('aria-invalid');
      if (!ABHA_RE.test(abha)) {
        form.elements.abha.setAttribute('aria-invalid', 'true');
        out.innerHTML = `<div class="banner err" style="margin-top:1rem">"${esc(raw || '(empty)')}" is not a valid ABHA ID. Use the format XX-XXXX-XXXX-XXXX (14 digits).</div>`;
        return;
      }
      const p = PATIENTS.get(abha);
      out.innerHTML = p
        ? `<div class="banner ok" style="margin-top:1rem"><strong>${esc(abha)} is registered.</strong><br>Hospitals visited: ${hospitalsVisited(p).map((h) => esc(`${h.short} (${h.name})`)).join(', ')}.<br><span class="small">Medical details stay hidden until the patient gives consent or shares their QR token.</span></div>`
        : `<div class="banner warn" style="margin-top:1rem">${esc(abha)} has a valid format but is not registered in this system.</div>`;
    },
    register(form) {
      const h = currentHospital();
      if (!h) return go('#/login/hospital');
      const name = val(form, 'name').replace(/\s+/g, ' ');
      const abha = normAbha(val(form, 'abha'));
      const age = Number(val(form, 'age'));
      const doc = DOCTOR[val(form, 'doctor')];
      const dx = val(form, 'diagnosis');
      const code = val(form, 'code').toUpperCase();
      if (name.length < 2 || !/^[\p{L} .'-]+$/u.test(name)) return formError(form, 'Enter the patient\'s full name (letters only).', 'name');
      if (!ABHA_RE.test(abha)) return formError(form, 'ABHA ID must look like 12-3456-7890-1234 (14 digits).', 'abha');
      // ABHA IDs are portable: an existing record is never re-created or re-assigned from here.
      if (PATIENTS.has(abha)) return formError(form, 'A record with this ABHA ID already exists. The patient can share a QR token or consent OTP with your doctor instead.', 'abha');
      if (!val(form, 'age') || !Number.isInteger(age) || age < 0 || age > 120) return formError(form, 'Enter an age between 0 and 120.', 'age');
      if (!val(form, 'gender')) return formError(form, 'Choose a gender.', 'gender');
      if (!doc || doc.hospitalId !== h.id) return formError(form, 'Choose one of your hospital\'s doctors.', 'doctor');
      if (!dx) return formError(form, 'Enter the diagnosis.', 'diagnosis');
      if (code && !icdEdition(code)) return formError(form, icdFormatError(code), 'code');
      const coding = code ? icd(code) : noCode();
      PATIENTS.set(abha, {
        abha, name, age, gender: val(form, 'gender'), blood: val(form, 'blood') || 'Not known',
        allergies: val(form, 'allergies').split(',').map((s) => s.trim()).filter(Boolean),
        diagnosis: dx, dxCode: { ...coding }, assigned: [doc.id], policy: null, meds: [], reports: [], accessLog: [], qrToken: randomToken(),
        history: [{ id: uid('h'), date: now(), doctorId: doc.id, hospitalId: h.id, type: 'Diagnosis', title: `Registered with diagnosis: ${dx}`,
          details: `Registered by the ${h.short} desk and assigned to ${doc.name}.`, ...coding }],
      });
      flash(`${name} is registered and assigned to ${doc.name}. They can sign in with ABHA ID ${abha} (demo OTP ${DEMO_OTP}).`);
      render();
      window.scrollTo(0, 0);
    },
    elig(form) {
      const doc = currentDoctor();
      if (!doc) return go('#/login/doctor');
      const out = document.getElementById('elig-result');
      out.innerHTML = '';
      const sys = form.elements.system.value;
      const raw = val(form, 'code');
      if (!raw) return formError(form, sys === 'AYUSH' ? 'Enter the AYUSH treatment name.' : 'Enter an ICD code, for example E11 or N39.0.', 'code');
      const code = sys === 'ICD' ? raw.toUpperCase() : raw;
      if (sys === 'ICD' && !icdEdition(code)) return formError(form, icdFormatError(raw), 'code');
      const entry = sys === 'AYUSH' ? { system: 'AYUSH', ayushSystem: form.elements.ayushSystem.value, code } : { system: 'ICD', code };
      const abha = form.elements.patient.value;
      let r, who = '';
      if (abha) {
        const p = PATIENTS.get(abha);
        // Same rule as every other piece of medical data: assigned, or live QR / consent access.
        if (!access(doc, p)) return formError(form, 'You can only check patients you are allowed to open (assigned, QR token or consent).', 'patient');
        r = evaluateEligibility(entry, { policy: p.policy, date: now() });
        logEligibility(p, doc, `Eligibility tool: ${resultText(r)}`);
        who = `<p class="small">Patient: <strong>${esc(p.name)}</strong> · policy ${esc(r.policyStatus)} · this check is in their access log.</p>`;
      } else {
        r = evaluateEligibility(entry, { skipPolicy: true });
      }
      out.innerHTML = `<div style="margin-top:1rem">${eligBlock(r)}<p class="code-line">${esc(r.label)}</p>${abha ? who : `<p class="small">Policy: ${esc(r.policyStatus)}.</p>`}
        <p class="small muted">${esc(INSURANCE_RULES.note)}</p></div>`;
    },
    note(form) {
      const ctx = doctorWithAccess(form.dataset.abha);
      if (!ctx) return;
      const { doc, p } = ctx;
      const kind = val(form, 'kind'), dx = val(form, 'diagnosis'), text = val(form, 'text');
      if (kind === 'Diagnosis' && !dx) return formError(form, 'Enter the new diagnosis.', 'diagnosis');
      if (!text) return formError(form, 'Add a short note.', 'text');
      const coded = kind === 'Diagnosis' || kind === 'Treatment';
      const read = coded ? readCoding(form) : { coding: {} };
      if (read.error) return formError(form, read.error, read.field);
      if (kind === 'Diagnosis') { p.diagnosis = dx; p.dxCode = { ...read.coding }; }
      const title = kind === 'Diagnosis' ? `Diagnosis: ${dx}` : kind === 'Treatment' ? `Treatment: ${read.coding.code || 'not named'}` : kind === 'Visit' ? 'Visit' : 'Doctor note';
      const entry = { id: uid('h'), date: now(), doctorId: doc.id, hospitalId: doc.hospitalId, type: kind, title, details: text, ...read.coding };
      p.history.push(entry);
      const linked = linkToDoctor(doc, p);
      let elig = '';
      if (coded) {
        const r = checkInsuranceEligibility(p.abha, entry.id);
        logEligibility(p, doc, resultText(r));
        elig = ` Insurance: ${BADGE_TEXT[r.status][1]}.`;
      }
      flash(`Saved to ${p.name}'s history.${elig}${linked ? ` ${p.name} is now linked to you and ${HOSPITALS[doc.hospitalId].short}.` : ''}`);
      render();
      window.scrollTo(0, 0);
    },
    prescribe(form) {
      const ctx = doctorWithAccess(form.dataset.abha);
      if (!ctx) return;
      const { doc, p } = ctx;
      const brand = val(form, 'brand'), saltText = val(form, 'salt');
      for (const [name, msg] of [['brand', 'Enter the brand name.'], ['salt', 'Enter the salt / composition.'], ['dose', 'Enter the dose.'], ['frequency', 'Enter how often.'], ['duration', 'Enter the duration.']]) {
        if (!val(form, name)) return formError(form, msg, name);
      }
      const read = readCoding(form);
      if (read.error) return formError(form, read.error, read.field);
      const salts = parseSalts(saltText);
      const warnings = prescriptionWarnings(p, salts);
      if (warnings.length && !form.elements.ack.checked) return formError(form, 'Review the warnings above and tick the box to continue.', 'ack');
      const key = catKey(brand);
      const note = val(form, 'senote');
      p.meds.push({ id: uid('m'), brand: key || brand, salts, dose: val(form, 'dose'), frequency: val(form, 'frequency'), duration: val(form, 'duration'),
        start: now(), doctorId: doc.id, hospitalId: doc.hospitalId, status: 'active', isNew: true,
        se: key ? CAT[key].se : note ? { common: [note], serious: [], contact: '' } : null, ...read.coding });
      const entry = { id: uid('h'), date: now(), doctorId: doc.id, hospitalId: doc.hospitalId, type: 'Prescription', title: `${key || brand} prescribed`,
        details: `${salts.map((s) => `${s.name} ${s.strength}`.trim()).join(' + ')}; ${val(form, 'dose')}, ${val(form, 'frequency')}, ${val(form, 'duration')}.${warnings.length ? ' Prescribed after reviewing: ' + warnings.join(' ') : ''}`, ...read.coding };
      p.history.push(entry);
      const linked = linkToDoctor(doc, p);
      const r = checkInsuranceEligibility(p.abha, entry.id);
      logEligibility(p, doc, resultText(r));
      flash(`Prescription saved. Insurance: ${BADGE_TEXT[r.status][1]}.${linked ? ` ${p.name} is now linked to you and ${HOSPITALS[doc.hospitalId].short}.` : ''}`);
      render();
      window.scrollTo(0, 0);
    },
    upload(form) {
      const p = currentPatient();
      if (!p) return go('#/login/patient');
      const file = form.elements.file.files[0];
      const type = val(form, 'type'), date = val(form, 'date'), lab = val(form, 'lab');
      if (!file) return formError(form, 'Choose a PDF or image file.', 'file');
      if (!(file.type === 'application/pdf' || file.type.startsWith('image/'))) return formError(form, 'Only PDF or image files can be uploaded.', 'file');
      if (file.size > MAX_UPLOAD) return formError(form, 'The file is larger than 5 MB.', 'file');
      if (!type) return formError(form, 'Choose the report type.', 'type');
      if (!date) return formError(form, 'Enter the report date.', 'date');
      if (date > isoDay(Date.now())) return formError(form, 'The report date cannot be in the future.', 'date');
      if (!lab) return formError(form, 'Enter the lab or hospital name.', 'lab');
      const reader = new FileReader();
      reader.onerror = () => formError(form, 'The file could not be read. Try another file.');
      reader.onload = () => {
        if (currentPatient() !== p) return;
        const [y, m, d] = date.split('-').map(Number);
        p.reports.push({ id: uid('r'), type, date: new Date(y, m - 1, d).getTime(), lab, fileName: file.name, mime: file.type, dataUrl: reader.result, uploadedBy: 'patient', uploadedAt: now() });
        flash(`Uploaded "${file.name}".`);
        render();
        document.getElementById('p-reports').scrollIntoView();
      };
      reader.readAsDataURL(file);
    },
  };

  /* ---------- click actions ---------- */
  function reportFor(abha, id) {
    // Patients reach only their own reports; doctors only with assignment or live QR / consent access.
    const p = PATIENTS.get(abha);
    if (!p) return null;
    const allowed = (currentPatient() && currentPatient() === p) || access(currentDoctor(), p);
    return allowed ? p.reports.find((r) => r.id === id) : null;
  }
  function openViewer(title, html) {
    document.getElementById('viewer-title').textContent = title;
    document.getElementById('viewer-body').innerHTML = html;
    document.getElementById('viewer').showModal();
  }
  function dataUrlToBlobUrl(dataUrl) {
    const [meta, data] = dataUrl.split(',');
    const mime = meta.slice(5).split(';')[0];
    const bytes = meta.includes(';base64') ? Uint8Array.from(atob(data), (c) => c.charCodeAt(0)) : new TextEncoder().encode(decodeURIComponent(data));
    return URL.createObjectURL(new Blob([bytes], { type: mime }));
  }

  const ACTIONS = {
    skip() { document.getElementById('main').focus(); },
    theme() { theme = theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = theme; renderSession(); },
    logout() { session = null; afterLogin = null; flash('You have signed out.'); flashBox.dataset.keep = '1'; go('#/'); },
    fill(el) { prefill = { role: el.dataset.role, id: el.dataset.id, secret: el.dataset.secret }; go(`#/login/${el.dataset.role}`); },
    jump(el) { const t = document.getElementById(el.dataset.target); if (t) { t.scrollIntoView(); t.tabIndex = -1; t.focus({ preventScroll: true }); } },
    print() { window.print(); },
    'cs-pick'(el) {
      const ctx = doctorWithAccess(el.dataset.abha);
      if (!ctx) return;
      ctx.p.ayushDx = { code: el.dataset.code, display: el.dataset.display };
      flash(`AYUSH diagnosis set to ${el.dataset.display} (${el.dataset.code}).`);
      render();
    },
    'ins-more'(el) {
      const box = el.closest('section');
      const open = box.classList.toggle('ins-collapsed') === false;
      el.setAttribute('aria-expanded', String(open));
      el.textContent = open ? 'Show fewer' : `Show all ${box.querySelectorAll('tbody.ins-visit').length} visits`;
    },
    clock(el) {
      if (!currentDoctor()) return;
      clockOffset = Number(el.dataset.min) * MIN;
      flash(clockOffset ? `Demo clock moved ${el.dataset.min} minutes ahead.` : 'Demo clock reset to real time.', 'info');
      render();
    },
    'verify-token'(el) {
      const doc = currentDoctor();
      if (!doc) return go('#/login/doctor');
      const p = [...PATIENTS.values()].find((x) => x.qrToken && x.qrToken === el.dataset.token);
      if (!p) { flash('This token is no longer valid.', 'err'); return go('#/doctor'); }
      if (!p.assigned.includes(doc.id)) grantAccess(doc, p, 'QR token');
      go(`#/doctor/patient/${p.abha}`);
    },
    'qr-regenerate'() { const p = currentPatient(); if (!p) return; p.qrToken = randomToken(); flash('New token created. The old token no longer works.'); render(); },
    'qr-revoke'() { const p = currentPatient(); if (!p) return; p.qrToken = null; flash('Token revoked. It no longer works.'); render(); },
    'preview-report'(el) {
      const r = reportFor(el.dataset.abha, el.dataset.id);
      if (!r) return flash('You cannot open this report.', 'err');
      if (viewerUrl) URL.revokeObjectURL(viewerUrl);
      viewerUrl = dataUrlToBlobUrl(r.dataUrl);
      const body = r.mime === 'application/pdf'
        ? `<iframe src="${viewerUrl}" title="${esc(r.type)} (PDF)"></iframe><p class="small"><a href="${viewerUrl}" target="_blank" rel="noopener">Open the PDF in a new tab</a></p>`
        : `<img src="${viewerUrl}" alt="${esc(r.type)} report from ${esc(r.lab)}, ${fmtDate(r.date)}">`;
      openViewer(`${r.type} · ${fmtDate(r.date)}`, body);
    },
    'download-report'(el) {
      const r = reportFor(el.dataset.abha, el.dataset.id);
      if (!r) return flash('You cannot download this report.', 'err');
      const a = document.createElement('a');
      a.href = r.dataUrl;
      a.download = r.fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
    },
    'delete-report'(el) {
      const p = currentPatient();
      if (!p) return;
      const r = p.reports.find((x) => x.id === el.dataset.id && x.uploadedBy === 'patient');
      if (!r || !confirm(`Delete "${r.type}" (${r.fileName})? This cannot be undone.`)) return;
      p.reports = p.reports.filter((x) => x !== r);
      flash('Report deleted.');
      render();
    },
    'stop-med'(el) {
      const ctx = doctorWithAccess(el.dataset.abha);
      if (!ctx || ctx.acc.kind !== 'assigned') return flash('Only an assigned doctor can stop a medicine.', 'err');
      const m = ctx.p.meds.find((x) => x.id === el.dataset.id && x.status === 'active');
      if (!m) return;
      const reason = prompt(`Reason for stopping ${m.brand} (optional):`, '');
      if (reason === null) return;
      Object.assign(m, { status: 'stopped', stoppedAt: now(), stoppedBy: ctx.doc.id, stopReason: reason.trim() });
      ctx.p.history.push({ id: uid('h'), date: now(), doctorId: ctx.doc.id, hospitalId: ctx.doc.hospitalId, type: 'Prescription', title: `${m.brand} stopped`, details: reason.trim() || 'Stopped by the doctor.' });
      flash(`${m.brand} stopped.`);
      render();
    },
    'save-final'(el) {
      const ctx = doctorWithAccess(el.dataset.abha);
      if (!ctx || ctx.acc.kind !== 'assigned') return flash('Link the patient to you before saving a final report.', 'err');
      const { doc, p } = ctx;
      const at = now();
      p.history.push({ id: uid('h'), date: at, doctorId: doc.id, hospitalId: doc.hospitalId, type: 'Final report', title: `Final report issued by ${HOSPITALS[doc.hospitalId].short}`,
        details: `Diagnosis: ${p.diagnosis}. ${p.meds.filter((m) => m.status === 'active').length} current medicines.`, snapshot: reportHtml(p, doc, at) });
      flash('Final report saved to the patient timeline.');
      render();
    },
    'view-final'(el) {
      const p = PATIENTS.get(el.dataset.abha);
      const allowed = p && ((currentPatient() && currentPatient() === p) || access(currentDoctor(), p));
      const h = allowed && p.history.find((x) => x.id === el.dataset.id && x.snapshot);
      if (!h) return flash('You cannot open this report.', 'err');
      openViewer(h.title, `<div class="report">${h.snapshot}</div>`);
    },
    'close-viewer'() { document.getElementById('viewer').close(); },
  };

  // Shows the fields for the chosen system and refreshes the live eligibility badge.
  function syncCoding(form, changed) {
    const fs = form.querySelector('fieldset.coding');
    if (form.elements.kind && fs) {
      const kind = form.elements.kind.value;
      fs.hidden = !(kind === 'Diagnosis' || kind === 'Treatment');
      if (changed && changed.name === 'kind' && kind === 'Treatment') form.elements.system.value = 'AYUSH';
    }
    const sys = form.elements.system.value;
    form.querySelectorAll('[data-for]').forEach((el) => { el.hidden = el.dataset.for !== sys; });
    const live = form.querySelector('.elig-live');
    const p = form.dataset.abha && PATIENTS.get(form.dataset.abha);
    if (!live || !p) return;
    const read = readCoding(form, { lenient: true });
    live.innerHTML = read.error
      ? `<div class="banner warn" style="margin:.5rem 0 0">${esc(read.error)}</div>`
      : eligBlock(evaluateEligibility(read.coding, { policy: p.policy, date: now() }));
  }

  /* ---------- wiring ---------- */
  // Activity resets the idle timer, unless the session has already timed out.
  ['click', 'keydown', 'submit'].forEach((type) => document.addEventListener(type, (e) => {
    if (session && Date.now() - lastActivity > IDLE_LIMIT) { e.preventDefault(); e.stopPropagation(); endSession(true); return; }
    lastActivity = Date.now();
  }, true));

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || !ACTIONS[el.dataset.action]) return;
    e.preventDefault();
    ACTIONS[el.dataset.action](el, e);
  });
  document.addEventListener('submit', (e) => {
    const form = e.target.closest('form[data-form]');
    if (!form || !FORMS[form.dataset.form]) return;
    e.preventDefault();
    const box = form.querySelector('.form-error');
    if (box) box.hidden = true;
    FORMS[form.dataset.form](form);
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.matches('[data-filter="mine"]')) {
      const q = t.value.trim().toLowerCase();
      let shown = 0;
      document.querySelectorAll('#mine-list > li').forEach((li) => { const hit = li.dataset.search.includes(q); li.hidden = !hit; shown += hit; });
      document.getElementById('mine-empty').hidden = shown > 0;
    }
    if (t.matches('[data-filter="hosp"]')) {
      const q = t.value.trim().toLowerCase();
      let shown = 0;
      document.querySelectorAll('#hosp-rows > tr').forEach((tr) => { const hit = tr.dataset.search.includes(q); tr.hidden = !hit; shown += hit; });
      document.getElementById('hosp-empty').hidden = shown > 0;
    }
    if (t.matches('[data-cs-search]')) {
      const q = t.value.trim();
      const out = t.closest('section').querySelector('.cs-results');
      clearTimeout(t._timer);
      if (q.length < 2) { out.innerHTML = ''; return; }
      t._timer = setTimeout(() => {
        api(`/search/autocomplete?q=${encodeURIComponent(q)}&limit=8`).then((res) => {
          if (t.value.trim() !== q) return;
          const hits = res.items.filter((s) => s.system.endsWith('namaste'));
          out.innerHTML = hits.length
            ? `<ul class="list">${hits.map((s) => `<li><button class="btn btn-ghost btn-sm" data-action="cs-pick" data-abha="${esc(t.dataset.csSearch)}" data-code="${esc(s.code)}" data-display="${esc(s.display)}">${esc(s.display)} <span class="mono">${esc(s.code)}</span>${s.devanagari ? ` ${esc(s.devanagari)}` : ''}</button></li>`).join('')}</ul>`
            : '<p class="small muted">No NAMASTE term found.</p>';
        }).catch(() => { out.innerHTML = '<p class="small muted">The NamaSetu API is not reachable.</p>'; });
      }, 250);
    }
    const coded = t.closest('form');
    if (coded && coded.elements.system) syncCoding(coded, t);
    const form = t.closest('form[data-form="prescribe"]');
    if (form) {
      if (t.name === 'brand') {
        const key = catKey(t.value);
        if (key && (!form.elements.salt.value || form.elements.salt.dataset.auto)) {
          form.elements.salt.value = CAT[key].salts.map(([n, s]) => `${n} ${s}`).join(' + ');
          form.elements.salt.dataset.auto = '1';
        }
      }
      if (t.name === 'salt') delete t.dataset.auto;
      const p = PATIENTS.get(form.dataset.abha);
      const salts = parseSalts(form.elements.salt.value);
      const warnings = p && form.elements.salt.value.trim() ? prescriptionWarnings(p, salts) : [];
      form.querySelector('.rx-warnings').innerHTML = warnings.length ? `<div class="banner warn" style="margin:1rem 0 0"><strong>Check before prescribing</strong><ul class="warn-list">${warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '';
      form.querySelector('.rx-ack').hidden = !warnings.length;
      if (!warnings.length) form.elements.ack.checked = false;
    }
  });
  document.getElementById('viewer').addEventListener('close', () => {
    document.getElementById('viewer-body').innerHTML = '';
    if (viewerUrl) { URL.revokeObjectURL(viewerUrl); viewerUrl = null; }
  });

  setInterval(() => {
    if (session && Date.now() - lastActivity > IDLE_LIMIT) return endSession(true);
    let expired = false;
    document.querySelectorAll('[data-countdown]').forEach((el) => {
      const left = Number(el.dataset.countdown) - now();
      if (left <= 0) expired = true;
      else el.textContent = `${Math.ceil(left / MIN)} min left`;
    });
    if (expired) render();
  }, 15e3);

  window.addEventListener('hashchange', () => render(true));
  document.documentElement.dataset.theme = theme;
  render(true);
})();
</script>
<script>
// Floating particle field: a light 2D-canvas take on the main site's 3D background. Dots drift upward
// and bob as if weightless, ease away from the pointer and back, shift with depth for parallax, and
// faint lines join near neighbours. Static under prefers-reduced-motion.
(() => {
  'use strict';
  const canvas = document.getElementById('fx');
  const ctx = canvas && canvas.getContext('2d');
  if (!ctx) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  const COLORS = ['14,165,233', '56,189,248', '20,184,166', '248,251,255'];
  const LINK_DIST = 90, LINKED = 90, REPEL = 120, EASE = 0.06, PARALLAX = 14;
  let W = 0, H = 0, pts = [], last = 0, raf = 0;
  const mouse = { x: -1e4, y: -1e4, nx: 0, ny: 0 };

  // One pre-rendered soft glow per colour, so each frame is cheap drawImage calls.
  const sprites = COLORS.map((c) => {
    const s = document.createElement('canvas');
    s.width = s.height = 32;
    const g = s.getContext('2d'), grad = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, `rgba(${c},1)`); grad.addColorStop(0.35, `rgba(${c},.55)`); grad.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = grad; g.fillRect(0, 0, 32, 32);
    return s;
  });

  function setup() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = W < 768 ? 200 : 450;
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H, z: Math.random(), // z = depth: speed, size, parallax
      r: 1 + Math.random() * 2, a: 0.3 + Math.random() * 0.6, s: Math.floor(Math.random() * COLORS.length),
      vy: 8 + Math.random() * 22, vx: (Math.random() - 0.5) * 8,
      p: Math.random() * 6.28, f: 0.2 + Math.random() * 0.5, ox: 0, oy: 0, sx: 0, sy: 0,
    }));
  }

  function frame(t) {
    const dt = last ? Math.min((t - last) / 1000, 0.05) : 0, sec = t / 1000, still = reduce.matches;
    last = t;
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      if (!still) {
        p.y -= p.vy * dt * (0.5 + p.z);
        p.x += p.vx * dt;
        if (p.y < -12) { p.y = H + 12; p.x = Math.random() * W; }
        if (p.x < -12) p.x = W + 12; else if (p.x > W + 12) p.x = -12;
      }
      const bx = still ? 0 : Math.sin(sec * p.f + p.p) * 6, by = still ? 0 : Math.cos(sec * p.f * 1.3 + p.p) * 6;
      const px = p.x + bx - mouse.nx * PARALLAX * p.z, py = p.y + by - mouse.ny * PARALLAX * p.z;
      let tx = 0, ty = 0;
      const dx = px - mouse.x, dy = py - mouse.y, d = Math.hypot(dx, dy);
      if (!still && d < REPEL && d > 0.01) { const push = (1 - d / REPEL) * 40; tx = (dx / d) * push; ty = (dy / d) * push; }
      p.ox += (tx - p.ox) * EASE; p.oy += (ty - p.oy) * EASE;
      p.sx = px + p.ox; p.sy = py + p.oy;
      const size = p.r * (1.3 + p.z * 1.4);
      ctx.globalAlpha = p.a * 0.85;
      ctx.drawImage(sprites[p.s], p.sx - size, p.sy - size, size * 2, size * 2);
    }
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
    for (let i = 0; i < LINKED; i++) {
      for (let j = i + 1; j < LINKED; j++) {
        const a = pts[i], b = pts[j], d = Math.hypot(a.sx - b.sx, a.sy - b.sy);
        if (d < LINK_DIST) {
          ctx.strokeStyle = `rgba(14,165,233,${(0.14 * (1 - d / LINK_DIST)).toFixed(3)})`;
          ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
        }
      }
    }
    if (!still) raf = requestAnimationFrame(frame);
  }

  function start() { cancelAnimationFrame(raf); last = 0; raf = requestAnimationFrame(frame); }
  window.addEventListener('pointermove', (e) => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    mouse.nx = e.clientX / W * 2 - 1; mouse.ny = e.clientY / H * 2 - 1;
  }, { passive: true });
  document.addEventListener('pointerleave', () => { mouse.x = mouse.y = -1e4; });
  let resizeTimer = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { setup(); start(); }, 150); });
  reduce.addEventListener?.('change', start);
  setup(); start();
})();
</script>
</body>
</html>
