/* Light medical-blue theme, matching the main site. --accent is the AA-safe blue (white text on it is 5.9:1);
   --glass is the frosted card surface over the particle background; --surface stays solid for fields and dialogs. */
:root{color-scheme:light;--bg:#f5faff;--surface:#fff;--glass:rgba(255,255,255,.8);--text:#0b1e33;--muted:#475569;--border:#dceaf7;--accent:#0369a1;--accent-strong:#075985;--accent-soft:#e0f2fe;--on-accent:#fff;--grad:linear-gradient(135deg,#0369a1,#0f766e);--grad-text:linear-gradient(135deg,#0284c7,#0d9488);--glow:rgba(14,165,233,.35);--shadow:0 8px 30px -12px rgba(14,165,233,.22);--shadow-lg:0 20px 60px -15px rgba(14,165,233,.25);--warn-bg:#fff6e5;--warn-ink:#73450a;--warn-line:#e9b45a;--err-bg:#fdeded;--err-ink:#9b1c1c;--ok-bg:#e9f6ef;--ok-ink:#14532d;--radius:24px}
[data-theme=dark]{color-scheme:dark;--bg:#07131f;--surface:#0f1b2a;--glass:rgba(15,23,42,.72);--text:#f1f7fd;--muted:#b6c4d4;--border:#1d3348;--accent:#38bdf8;--accent-strong:#7dd3fc;--accent-soft:#0c2a3f;--on-accent:#082f49;--grad-text:linear-gradient(135deg,#38bdf8,#2dd4bf);--glow:rgba(56,189,248,.45);--shadow:0 8px 30px -12px rgba(0,0,0,.5);--shadow-lg:0 20px 60px -15px rgba(0,0,0,.6);--warn-bg:#2f240e;--warn-ink:#fcd58a;--warn-line:#7a5b1e;--err-bg:#3a1517;--err-ink:#fca5a5;--ok-bg:#11301f;--ok-ink:#86efac}
*{box-sizing:border-box}
html{font-size:112.5%;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#7dd3fc transparent}

body{margin:0;font-family:"Inter Variable",Inter,"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh}

/* Background: blurred colour orbs and a floating particle canvas (drawn by the script at the end of the page). */
.bg-fx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg-fx canvas{position:absolute;inset:0;width:100%;height:100%}
.orb{position:absolute;border-radius:50%;filter:blur(64px);opacity:.15}
.orb-1{left:-10vw;top:-15vh;width:60vh;height:60vh;background:#7dd3fc;animation:orb 28s ease-in-out infinite}
.orb-2{right:-12vw;top:25vh;width:70vh;height:70vh;background:#5eead4;animation:orb 40s ease-in-out infinite reverse}
.orb-3{left:30vw;bottom:-20vh;width:55vh;height:55vh;background:#bae6fd;animation:orb 28s ease-in-out infinite}
@keyframes orb{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,-4vh,0) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
/* Headings glow on hover, as on the main site (only where a real hover exists). */
@media (hover:hover){
  h1,h2,h3{transition:color .2s ease,text-shadow .2s ease}
  main h1:hover,main h2:hover,main h3:hover{color:var(--accent);text-shadow:0 1px 0 rgba(255,255,255,.9),0 0 18px var(--glow)}
  [data-theme=dark] main h1:hover,[data-theme=dark] main h2:hover,[data-theme=dark] main h3:hover{text-shadow:0 0 20px var(--glow)}
  .lead,.muted{transition:color .2s ease,text-shadow .2s ease}

.card{background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--radius);padding:1.4rem 1.5rem;box-shadow:var(--shadow);transition:box-shadow .2s ease}

.narrow{max-width:520px;margin:0 auto}
.banner{border-radius:16px;padding:.9rem 1.1rem;margin:0 0 1.25rem;border:1px solid var(--border);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}

:root{--a-sky:linear-gradient(90deg,#0ea5e9,#38bdf8);--a-teal:linear-gradient(90deg,#14b8a6,#5eead4);--a-violet:linear-gradient(90deg,#8b5cf6,#c4b5fd);--a-indigo:linear-gradient(90deg,#6366f1,#a5b4fc);--a-amber:linear-gradient(90deg,#f59e0b,#fcd34d);--ink-sky:#0369a1;--ink-teal:#0f766e;--ink-violet:#6d28d9;--ink-indigo:#4338ca;--ink-amber:#92400e;--hover-glow:0 24px 60px -18px rgba(14,165,233,.45),0 0 0 1px rgba(125,211,252,.55)}

.card{--card-accent:var(--grad);background:var(--card-accent) top/100% 4px no-repeat,var(--glass);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.card.a-sky{--card-accent:var(--a-sky)}.card.a-teal{--card-accent:var(--a-teal)}.card.a-violet{--card-accent:var(--a-violet)}.card.a-indigo{--card-accent:var(--a-indigo)}.card.a-amber{--card-accent:var(--a-amber)}

input:not([type=checkbox]):not([type=file]):hover,select:hover,textarea:hover{border-color:#7dd3fc;box-shadow:0 0 0 4px rgba(14,165,233,.12),0 10px 30px -12px rgba(14,165,233,.35)}

.welcome .who{flex:1;min-width:14rem}

.avatar{flex:none;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--grad);color:#fff;font:800 1.35rem/1 "Plus Jakarta Sans Variable",system-ui,sans-serif;box-shadow:0 12px 28px -10px rgba(3,105,161,.55)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin:0 0 1.5rem}
.stat{position:relative;padding:1rem 1.15rem;border-radius:20px;border:1px solid var(--border);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--shadow);transition:transform .25s ease,box-shadow .25s ease}
.stat::after{content:"";position:absolute;left:1.15rem;right:1.15rem;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--stat-accent,var(--grad))}
.stat:hover{transform:translateY(-4px);box-shadow:var(--hover-glow)}
.stat .num{display:block;font:800 1.75rem/1.15 "Plus Jakarta Sans Variable",system-ui,sans-serif;letter-spacing:-.02em}
.stat .lbl{display:block;font-size:.85rem;color:var(--muted);margin-top:.15rem}
.stat.a-sky{--stat-accent:var(--a-sky)}.stat.a-sky .num{color:var(--ink-sky)}
.stat.a-teal{--stat-accent:var(--a-teal)}.stat.a-teal .num{color:var(--ink-teal)}
.stat.a-violet{--stat-accent:var(--a-violet)}.stat.a-violet .num{color:var(--ink-violet)}
.stat.a-indigo{--stat-accent:var(--a-indigo)}.stat.a-indigo .num{color:var(--ink-indigo)}
.stat.a-amber{--stat-accent:var(--a-amber)}.stat.a-amber .num{color:var(--ink-amber)}
.section-gap{margin-top:1.25rem}
@media (prefers-reduced-motion:reduce){.card:hover,.stat:hover,.welcome:hover{transform:none}}
@media print{.card,.stat,.welcome{box-shadow:none!important;transform:none!important;background:#fff!important}.stats,.welcome .avatar{display:none}}
/* Clinical summary */
:root{--t-namaste:#ecfdf5;--t-namaste-line:#a7f3d0;--t-who:#eff6ff;--t-who-line:#bfdbfe;--t-bio:#fffbeb;--t-bio-line:#fde68a}
[data-theme=dark]{--t-namaste:#0b2a20;--t-namaste-line:#14532d;--t-who:#0c1d33;--t-who-line:#1e3a8a;--t-bio:#2a2108;--t-bio-line:#78350f}
.cs-grid2{display:grid;gap:1.25rem}
@media(min-width:900px){.cs-grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.tiles{display:grid;gap:.75rem;margin-top:1rem}
@media(min-width:760px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{border-radius:14px;padding:1rem;border:1px solid}
.tile .code{font-family:ui-monospace,Consolas,monospace;font-size:1.25rem;font-weight:800;margin:.2rem 0;overflow-wrap:anywhere}
.tile-namaste{background:var(--t-namaste);border-color:var(--t-namaste-line)}
.tile-who{background:var(--t-who);border-color:var(--t-who-line)}
.tile-bio{background:var(--t-bio);border-color:var(--t-bio-line)}
.salt-chip{display:inline-block;margin:0 .25rem .25rem 0;padding:.05rem .55rem;border-radius:999px;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;border:1px solid var(--ok-ink);color:var(--ok-ink)}
.sev{display:inline-block;padding:.1rem .55rem;border-radius:8px;font-size:.78rem;font-weight:700;border:1.5px solid currentColor;text-transform:uppercase}
.sev-major{background:var(--err-bg);color:var(--err-ink)}
.sev-moderate{background:var(--warn-bg);color:var(--warn-ink)}
.sev-minor{color:var(--muted)}
.alert-box.major{background:var(--err-bg);border-color:var(--err-ink)}
.alert-box.moderate{background:var(--warn-bg);border-color:var(--warn-line)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;overflow-wrap:anywhere}
.cs-table td{vertical-align:top}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media print{
  :root,[data-theme=dark]{--bg:#fff;--surface:#fff;--text:#000;--muted:#333;--border:#999;--accent:#0f766e;--accent-strong:#0f766e;--warn-bg:#fff;--warn-ink:#000;--warn-line:#999}
  html{font-size:11pt}

  body{background:#fff}

  .report{border:0!important;padding:0!important}

  @page{margin:14mm}
}

<script>
// Everything lives inside this closure: no state or function is reachable from the browser console.
(() => {
  'use strict';

  /* ---------- constants and small helpers ---------- */
  const MIN = 60e3, DAY = 864e5;
  const IDLE_LIMIT = 10 * MIN;        // session timeout after 10 minutes without activity
  const ACCESS_WINDOW = 30 * MIN;     // QR / consent access lasts 30 minutes
  const NEW_WINDOW = 30 * DAY;        // a medicine is shown as "New" for 30 days
  const DEMO_OTP = '123456';
  const ABHA_RE = /^\d{2}-\d{4}-\d{4}-\d{4}$/;
  const MAX_UPLOAD = 5 * 1024 * 1024;

  let clockOffset = 0;                // demo clock: lets a reviewer test the 30-minute expiry
  const now = () => Date.now() + clockOffset;
  const loadedAt = Date.now();
  const daysAgo = (d) => loadedAt - d * DAY;

  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = (t) => new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  const fmtTime = (t) => new Date(t).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  const fmtDateTime = (t) => `${fmtDate(t)}, ${fmtTime(t)}`;
  const pad = (n) => String(n).padStart(2, '0');
  const isoDay = (t) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  let seq = 0;
  const uid = (p) => `${p}${(++seq).toString(36)}`;
  const randomToken = () => {
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    return 'NSQR-' + Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('').toUpperCase().match(/.{4}/g).join('-');
  };
  const normAbha = (v) => {
    const s = String(v || '').trim();
    const digits = s.replace(/\D/g, '');
    return /^[\d\s-]+$/.test(s) && digits.length === 14 ? `${digits.slice(0, 2)}-${digits.slice(2, 6)}-${digits.slice(6, 10)}-${digits.slice(10)}` : s;
  };

  /* ---------- fictional data ---------- */
  const HOSPITALS = {
    A: { id: 'A', short: 'Hospital A', name: 'Sunrise General Hospital', regId: 'HFR-DEMO-A-1001', password: 'HospitalA@123',
      address: 'Plot 12, Sector 34-A, Chandigarh 160022 (fictional)', contact: '+91 172 000 0101 · help@sunrise.example',
      departments: ['General Medicine', 'Endocrinology', 'Cardiology', 'Rheumatology', 'AYUSH wing (Ayurveda, Yoga)', 'Emergency'], beds: 220 },
    B: { id: 'B', short: 'Hospital B', name: 'Riverside Community Hospital', regId: 'HFR-DEMO-B-2001', password: 'HospitalB@123',
      address: '14 Mall Road, Ludhiana 141001 (fictional)', contact: '+91 161 000 0202 · care@riverside.example',
      departments: ['General Medicine', 'Pulmonology', 'Paediatrics', 'Emergency'], beds: 140 },
  };

  const DOCTORS = [
    { id: 'dA1', name: 'Dr. Anjali Mehta', spec: 'Endocrinology', hospitalId: 'A', hprId: 'HPR-DEMO-1101', abha: '99-7001-1101-0001', password: 'DoctorA1@123' },
    { id: 'dA2', name: 'Dr. Rohan Iyer', spec: 'Cardiology', hospitalId: 'A', hprId: 'HPR-DEMO-1102', abha: '99-7001-1102-0002', password: 'DoctorA2@123' },
    { id: 'dA3', name: 'Dr. Sanjay Gupta', spec: 'Rheumatology', hospitalId: 'A', hprId: 'HPR-DEMO-1103', abha: '99-7001-1103-0003', password: 'DoctorA3@123' },
    { id: 'dB1', name: 'Dr. Vikram Rao', spec: 'General Medicine', hospitalId: 'B', hprId: 'HPR-DEMO-2101', abha: '99-7002-2101-0004', password: 'DoctorB1@123' },
    { id: 'dB2', name: 'Dr. Farhan Qureshi', spec: 'Pulmonology', hospitalId: 'B', hprId: 'HPR-DEMO-2102', abha: '99-7002-2102-0005', password: 'DoctorB2@123' },
    { id: 'dB3', name: 'Dr. Neha Kapoor', spec: 'General Medicine', hospitalId: 'B', hprId: 'HPR-DEMO-2103', abha: '99-7002-2103-0006', password: 'DoctorB3@123' },
  ];
  const DOCTOR = Object.fromEntries(DOCTORS.map((d) => [d.id, d]));
  // Work contact details (fictional), shown on the hospital's doctor-details page.
  [['dA1', 'OPD 4', 'Mon, Wed, Fri · 9:00–13:00', 1101], ['dA2', 'OPD 2', 'Tue, Thu, Sat · 10:00–14:00', 1102], ['dA3', 'OPD 7', 'Mon to Fri · 14:00–17:00', 1103],
    ['dB1', 'OPD 1', 'Mon to Sat · 9:00–12:00', 2101], ['dB2', 'OPD 3', 'Tue, Thu · 9:00–13:00', 2102], ['dB3', 'OPD 5', 'Mon, Wed, Fri · 15:00–18:00', 2103]]
    .forEach(([id, room, opd, ext]) => {
      const d = DOCTOR[id];
      const domain = d.hospitalId === 'A' ? 'sunrise.example' : 'riverside.example';
      Object.assign(d, { room, opd, phone: `${HOSPITALS[d.hospitalId].contact.split(' · ')[0]} ext. ${ext}`,
        email: `${d.name.replace('Dr. ', '').toLowerCase().replace(/\s+/g, '.')}@${domain}`, joined: 2015 + (ext % 7) });
    });

  // Demo medicine catalogue: brand -> salts and side-effect notes. Doses are entered by the prescribing doctor.
  const se = (common, serious, contact) => ({ common, serious, contact });
  const CAT = {
    'Glycomet 500': { salts: [['Metformin', '500 mg']], se: se(['Nausea', 'Loose stools', 'Metallic taste'], ['Lactic acidosis (rare)'], 'you feel very weak, breathe fast or have severe stomach pain.') },
    'Glyciphage 500': { salts: [['Metformin', '500 mg']], se: se(['Nausea', 'Loose stools'], ['Lactic acidosis (rare)'], 'you feel very weak, breathe fast or have severe stomach pain.') },
    'Jalra 50': { salts: [['Vildagliptin', '50 mg']], se: se(['Dizziness', 'Headache'], ['Inflamed pancreas (rare)', 'Liver problems (rare)'], 'you have severe stomach pain spreading to the back, or yellow eyes or skin.') },
    'Amlodac 5': { salts: [['Amlodipine', '5 mg']], se: se(['Ankle swelling', 'Flushing', 'Headache'], ['Fainting from low blood pressure'], 'you faint, or chest pain gets worse.') },
    'Telma 40': { salts: [['Telmisartan', '40 mg']], se: se(['Dizziness', 'Back pain'], ['High potassium', 'Swelling of face or lips (angioedema)'], 'your face, lips or throat swell, or your heartbeat feels slow or irregular.') },
    'Budecort 200 Inhaler': { salts: [['Budesonide', '200 mcg/puff']], se: se(['Hoarse voice', 'Throat irritation', 'Oral thrush (rinse mouth after use)'], ['Sudden wheeze after use (rare)'], 'white patches in the mouth do not clear, or breathing worsens.') },
    'Asthalin Inhaler': { salts: [['Salbutamol', '100 mcg/puff']], se: se(['Tremor', 'Fast heartbeat', 'Headache'], ['Breathing gets worse right after use (rare)'], 'you need it more often than usual, or have chest pain.') },
    'Montair 10': { salts: [['Montelukast', '10 mg']], se: se(['Headache', 'Stomach upset'], ['Mood or behaviour changes', 'Sleep problems'], 'you or your family notice mood or behaviour changes.') },
    'Thyronorm 50': { salts: [['Levothyroxine', '50 mcg']], se: se(['Palpitations if the dose is too high', 'Weight change'], ['Chest pain', 'Irregular heartbeat'], 'you have chest pain, a racing heart or tremor.') },
    'Uprise-D3 60K': { salts: [['Cholecalciferol (Vitamin D3)', '60000 IU']], se: se(['Constipation (uncommon)'], ['High calcium with overuse'], 'you have excessive thirst, confusion or vomiting.') },
    'Niftran 100': { salts: [['Nitrofurantoin', '100 mg']], se: se(['Nausea', 'Dark yellow urine', 'Headache'], ['Lung reaction (rare)', 'Numbness in hands or feet'], 'you get a cough, breathlessness or tingling.') },
    'Citralka Syrup': { salts: [['Disodium hydrogen citrate', '1.4 g/5 ml']], se: se(['Mild stomach upset', 'Bloating'], ['High potassium or sodium in kidney disease'], 'you have muscle weakness or swelling.') },
    'Augmentin 625': { salts: [['Amoxicillin', '500 mg'], ['Clavulanic acid', '125 mg']], se: se(['Loose stools', 'Nausea'], ['Allergic reaction (rash, swelling)', 'Severe diarrhoea'], 'you get a rash, swelling or bloody diarrhoea.') },
    'Folitrax 10': { salts: [['Methotrexate', '10 mg']], se: se(['Nausea', 'Mouth ulcers', 'Tiredness'], ['Low blood counts', 'Liver problems', 'Lung inflammation'], 'you have fever, sore throat, unusual bruising or a new cough.') },
    'Folvite 5': { salts: [['Folic acid', '5 mg']], se: se(['Mild stomach upset (uncommon)'], ['Allergic reaction (rare)'], 'you get a rash or swelling.') },
    'HCQS 200': { salts: [['Hydroxychloroquine', '200 mg']], se: se(['Nausea', 'Headache'], ['Eye (retina) damage with long use', 'Low blood sugar'], 'you notice any change in your vision.') },
    'Brufen 400': { salts: [['Ibuprofen', '400 mg']], se: se(['Acidity', 'Nausea'], ['Stomach bleeding', 'Kidney problems'], 'you pass black stools or vomit blood.') },
    'Combiflam': { salts: [['Ibuprofen', '400 mg'], ['Paracetamol', '325 mg']], se: se(['Acidity', 'Nausea'], ['Stomach bleeding', 'Liver harm if too much paracetamol is taken'], 'you pass black stools, vomit blood, or your eyes turn yellow.') },
    'Dolo 650': { salts: [['Paracetamol', '650 mg']], se: se(['Nausea (rare)'], ['Liver damage in overdose'], 'your eyes or skin turn yellow.') },
    'Pan 40': { salts: [['Pantoprazole', '40 mg']], se: se(['Headache', 'Gas'], ['Low magnesium with long use'], 'you have muscle cramps or severe diarrhoea.') },
    'Disprin': { salts: [['Aspirin', '350 mg']], se: se(['Stomach upset'], ['Bleeding', 'Asthma attack in aspirin-sensitive people'], 'you wheeze, vomit blood or pass black stools.') },
  };
  // Demo ICD code list (ICD-10 and a few ICD-11 equivalents). A code is "recognised" if it, or its category, is here.
  const ICD_CODES = {
    E11: 'Type 2 diabetes mellitus', I10: 'Essential (primary) hypertension', J45: 'Asthma', E03: 'Hypothyroidism',
    'N39.0': 'Urinary tract infection, site not specified', M06: 'Rheumatoid arthritis', E55: 'Vitamin D deficiency',
    'M25.5': 'Pain in joint', R30: 'Pain while passing urine',
    '5A11': 'Type 2 diabetes mellitus', BA00: 'Essential hypertension', CA23: 'Asthma', '5A00': 'Hypothyroidism',
    GC08: 'Urinary tract infection, site not specified', FA20: 'Rheumatoid arthritis',
  };

  /* ================= INSURANCE_RULES: the one place to change the demo eligibility rules ================= */
  const INSURANCE_RULES = {
    // Which treatment systems the demo plan covers. Set AYUSH to true to cover AYUSH treatments everywhere.
    coverage: { ICD: true, AYUSH: false },
    ayushSystems: ['Ayurveda', 'Yoga & Naturopathy', 'Unani', 'Siddha', 'Homeopathy'],
    icdFormats: [
      { edition: 'ICD-10', pattern: /^[A-Z][0-9]{2}(\.[0-9A-Z]{1,4})?$/ },              // E11, N39.0
      { edition: 'ICD-11', pattern: /^[1-9A-HJ-NP-Z][A-HJ-NP-Z][0-9][0-9A-HJ-NP-Z](\.[0-9A-HJ-NP-Z]{1,4})?$/ }, // 5A11, CA23.0

    recognisedIcdCodes: ICD_CODES,
    requireRecognisedCode: true,     // a well-formed but unknown ICD code needs review
    messages: {
      noPolicy: 'No insurance policy on file',
      expired: 'Not eligible: policy expired',
      notStarted: 'Not eligible: the policy had not started on the treatment date',
      ayushNotCovered: 'Not eligible: AYUSH treatments are not covered under this plan',
      icdNotCovered: 'Not eligible: ICD-coded treatments are not covered under this plan',
      eligible: 'Eligible',
      review: 'Needs review: add a valid ICD code',
      reviewAyush: 'Needs review: add the AYUSH treatment name',
    },
    note: 'Demo rules only. Actual coverage depends on the insurer\'s policy terms and applicable regulations.',

  /* ======================================================================================================== */

  const catKey = (brand) => Object.keys(CAT).find((k) => k.toLowerCase() === String(brand).trim().toLowerCase());

  // Allergy groups used to flag conflicts between listed allergies and prescribed salts.
  const ALLERGY_GROUPS = {
    penicillin: ['penicillin', 'amoxicillin', 'ampicillin', 'cloxacillin', 'piperacillin'],
    sulfa: ['sulfamethoxazole', 'sulfasalazine', 'sulfadiazine', 'cotrimoxazole'],
    nsaid: ['aspirin', 'ibuprofen', 'diclofenac', 'naproxen', 'aceclofenac', 'mefenamic acid', 'ketorolac'],
    aspirin: ['aspirin'],
  };

  const med = (brand, dose, frequency, duration, startedDaysAgo, doctorId, extra = {}) => ({
    id: uid('m'), brand, salts: CAT[brand].salts.map(([name, strength]) => ({ name, strength })),
    dose, frequency, duration, start: daysAgo(startedDaysAgo), doctorId, hospitalId: DOCTOR[doctorId].hospitalId,
    status: 'active', isNew: false, se: CAT[brand].se, ...extra,

  const ev = (d, doctorId, type, title, details, coding = {}) => ({ id: uid('h'), date: daysAgo(d), doctorId, hospitalId: DOCTOR[doctorId].hospitalId, type, title, details, ...coding });

  const policy = (insurer, number, startedDaysAgo, endsInDays, sumInsured) => ({ insurer, number, validFrom: daysAgo(startedDaysAgo), validTo: loadedAt + endsInDays * DAY, sumInsured });
  const log = (d, doctorId, method) => ({ time: daysAgo(d), doctorId, hospitalId: DOCTOR[doctorId].hospitalId, method });

  function sampleReport(title, lab, d, rows) {

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="720" height="${260 + rows.length * 34}" font-family="Segoe UI, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><rect width="100%" height="64" fill="#0f766e"/><text x="40" y="41" font-size="22" fill="#fff" font-weight="700">${esc(lab)}</text><text x="40" y="104" font-size="24" font-weight="700">${esc(title)}</text><text x="40" y="134" font-size="16" fill="#555">Report date: ${esc(fmtDate(daysAgo(d)))}</text><text x="40" y="170" font-size="14" fill="#555">TEST</text><text x="330" y="170" font-size="14" fill="#555">RESULT</text><text x="500" y="170" font-size="14" fill="#555">REFERENCE</text>${lines}<text x="40" y="${232 + rows.length * 34}" font-size="15" fill="#b45309" font-weight="700">SAMPLE — fictional demo report, not a real result</text></svg>`;
    return { id: uid('r'), type: title, date: daysAgo(d), lab, fileName: title.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.svg', mime: 'image/svg+xml',
      dataUrl: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg), uploadedBy: 'patient', uploadedAt: daysAgo(d) };
  }

  const PATIENTS = new Map();
  [
    { abha: '99-1001-2001-3001', name: 'Ramesh Kumar Sharma', age: 58, gender: 'Male', blood: 'B+', allergies: ['Sulfa drugs (sulfonamides)'],
      diagnosis: 'Type 2 diabetes mellitus', dxCode: icd('E11'), assigned: ['dA1', 'dB1'],
      policy: policy('Suraksha Health Insurance (fictional)', 'SHI-DEMO-0001-2026', 1095, 270, 500000),
      meds: [med('Glycomet 500', '1 tablet', 'Twice daily after meals', 'Ongoing', 410, 'dA1', icd('E11')),
        med('Jalra 50', '1 tablet', 'Twice daily', '3 months, then review', 6, 'dB1', { isNew: true, ...icd('E11') })],
      history: [ev(420, 'dA1', 'Diagnosis', 'Type 2 diabetes diagnosed', 'HbA1c 8.1 %. Started Glycomet 500; diet and daily walking advised.', icd('E11')),

        ev(6, 'dB1', 'Visit', 'Seen at Hospital B while travelling', 'Sugars above target (fasting 168 mg/dL).', { visit: 'v-p1-b' }),
        ev(6, 'dB1', 'Prescription', 'Jalra 50 prescribed', 'Vildagliptin 50 mg twice daily, added to metformin.', icd('E11', 'v-p1-b'))],
      reports: [sampleReport('HbA1c', 'Riverside Diagnostics (Hospital B lab)', 7, [['HbA1c', '7.9 %', '4.0 – 5.6 %'], ['Fasting glucose', '168 mg/dL', '70 – 100 mg/dL']]),
        sampleReport('Lipid profile', 'Sunrise Path Lab (Hospital A lab)', 200, [['Total cholesterol', '196 mg/dL', '< 200 mg/dL'], ['LDL', '118 mg/dL', '< 100 mg/dL'], ['Triglycerides', '160 mg/dL', '< 150 mg/dL']])],
      accessLog: [log(200, 'dA1', 'Assigned doctor'), log(6, 'dB1', 'Consent OTP')] },

  ].forEach((p) => { p.qrToken = randomToken(); PATIENTS.set(p.abha, p); });

  // AYUSH (NAMASTE) diagnosis recorded alongside the ICD one: real terms from NamaSetu's NAMASTE data. The
  // SAMPLE NAMASTE set has no term for hypertension or hypothyroidism, so those patients start without one.
  const AYUSH_DX = {
    '99-1001-2001-3001': { code: 'SAMPLE-AYU-0044', display: 'Madhumeha' },
    '99-1003-2003-3003': { code: 'SAMPLE-AYU-0018', display: 'Tamaka Shvasa' },

  };
  PATIENTS.forEach((p) => { p.ayushDx = AYUSH_DX[p.abha] || null; });

  /* ---------- runtime state (in memory only) ---------- */
  let session = null;             // { role: 'patient' | 'doctor' | 'hospital', id }
  let lastActivity = Date.now();
  let afterLogin = null;          // a protected page to open after the doctor signs in
  let prefill = null;             // demo credentials to fill into a login form
  let theme = 'light'; // light by default; the header button switches to dark
  const grants = [];              // { doctorId, abha, method, grantedAt, expiresAt }
  let viewerUrl = null;

  const ROLE_LABEL = { patient: 'Patient', doctor: 'Doctor', hospital: 'Hospital' };
  const app = document.getElementById('app');
  const flashBox = document.getElementById('flash');

  /* ---------- access rules ---------- */
  const currentDoctor = () => (session && session.role === 'doctor' ? DOCTOR[session.id] : null);
  const currentPatient = () => (session && session.role === 'patient' ? PATIENTS.get(session.id) : null);
  const currentHospital = () => (session && session.role === 'hospital' ? HOSPITALS[session.id] : null);
  const activeGrant = (doc, abha) => grants.filter((g) => g.doctorId === doc.id && g.abha === abha && g.expiresAt > now()).pop();
  function access(doc, p) {
    if (!doc || !p) return null;
    if (p.assigned.includes(doc.id)) return { kind: 'assigned' };
    const g = activeGrant(doc, p.abha);
    return g ? { kind: 'grant', grant: g } : null;
  }
  function hospitalsVisited(p) {
    const ids = new Set([...p.history.map((h) => h.hospitalId), ...p.meds.map((m) => m.hospitalId), ...p.assigned.map((d) => DOCTOR[d].hospitalId)]);
    return Object.values(HOSPITALS).filter((h) => ids.has(h.id));
  }
  function logAccess(p, doc, acc) {
    p.accessLog.unshift({ time: now(), doctorId: doc.id, hospitalId: doc.hospitalId, method: acc.kind === 'assigned' ? 'Assigned doctor' : acc.grant.method });
  }
  function grantAccess(doc, p, method) {
    grants.push({ doctorId: doc.id, abha: p.abha, method, grantedAt: now(), expiresAt: now() + ACCESS_WINDOW });
  }
  function linkToDoctor(doc, p) {
    if (p.assigned.includes(doc.id)) return false;
    p.assigned.push(doc.id);
    return true;
  }

  /* ---------- medicine safety checks ---------- */
  const isNewMed = (m) => m.status === 'active' && m.isNew && now() - m.start < NEW_WINDOW;
  const saltNames = (m) => m.salts.map((s) => s.name).join(' + ');
  const strengths = (m) => m.salts.map((s) => s.strength || '—').join(' + ');
  const composition = (m) => m.salts.map((s) => `${s.name}${s.strength ? ' ' + s.strength : ''}`).join(' + ');
  function parseSalts(text) {
    return String(text).split('+').map((part) => part.trim()).filter(Boolean).map((part) => {
      // "Name 1.4 g/5 ml": the strength starts at the first word that begins with a digit.
      const m = part.match(/^(.+?)\s+(\d.*)$/);
      return m ? { name: m[1].trim(), strength: m[2].trim() } : { name: part, strength: '' };
    });
  }
  function allergyTerms(allergy) {
    const a = allergy.toLowerCase();
    const terms = [];
    if (a.includes('penicillin')) terms.push(...ALLERGY_GROUPS.penicillin);
    if (a.includes('sulfa') || a.includes('sulpha')) terms.push(...ALLERGY_GROUPS.sulfa);
    if (a.includes('nsaid')) terms.push(...ALLERGY_GROUPS.nsaid);
    if (a.includes('aspirin')) terms.push(...ALLERGY_GROUPS.aspirin);
    if (!terms.length) terms.push(a.replace(/\(.*?\)/g, '').trim());
    return terms.filter(Boolean);
  }
  function allergyHits(p, salts) {
    const out = [];
    for (const allergy of p.allergies) {
      const terms = allergyTerms(allergy);
      for (const s of salts) {
        const n = s.name.toLowerCase();
        if (terms.some((t) => n.includes(t) || t.includes(n))) out.push({ allergy, salt: s.name });
      }
    }
    return out;
  }
  const medSource = (m) => `${m.brand} (${HOSPITALS[m.hospitalId].short}, ${DOCTOR[m.doctorId].name})`;
  function medWarnings(p, meds) {
    const warnings = [];
    const bySalt = new Map();
    for (const m of meds) for (const s of m.salts) {
      const k = s.name.toLowerCase();
      if (!bySalt.has(k)) bySalt.set(k, { name: s.name, meds: [] });
      if (!bySalt.get(k).meds.includes(m)) bySalt.get(k).meds.push(m);
    }
    for (const { name, meds: ms } of bySalt.values()) {
      if (ms.length > 1) warnings.push(`Duplicate salt: ${name} is in ${ms.map(medSource).join(' and ')}. Possible duplicate therapy.`);
    }
    for (const m of meds) for (const h of allergyHits(p, m.salts)) {
      warnings.push(`Allergy conflict: ${m.brand} contains ${h.salt}; patient's listed allergy is "${h.allergy}".`);

      if (dup.length) warnings.push(`Duplicate salt: ${s.name} is already in ${dup.map(medSource).join(' and ')}.`);

  /* ---------- insurance eligibility (all rules come from INSURANCE_RULES) ---------- */
  const icdEdition = (code) => (INSURANCE_RULES.icdFormats.find((f) => f.pattern.test(code)) || {}).edition || null;
  function icdDescription(code) {
    const known = INSURANCE_RULES.recognisedIcdCodes;

    return key ? known[key] : null;

  function codingLabel(e) {
    if (e.system === 'AYUSH') return `AYUSH · ${e.ayushSystem || 'system not given'}: ${e.code || 'treatment not given'}`;
    if (!e.code) return 'No code yet';

    return `${ed || 'ICD (invalid format)'} ${e.code} · ${icdDescription(e.code) || 'unrecognised code'}`;

  const policyStatusOn = (pol, date) => (date > pol.validTo ? 'Expired' : date < pol.validFrom ? 'Not started' : 'Active');
  const icdFormatError = (code) => `"${code}" is not a valid ICD code format. Use a letter and two digits with an optional decimal (E11, N39.0), or an ICD-11 code such as 5A11.`;

  // The single decision function. Order: policy on file, policy valid on the treatment date, system, code.
  function evaluateEligibility(entry, { policy: pol, date, skipPolicy = false }) {
    const R = INSURANCE_RULES, M = R.messages;
    const raw = String(entry.code || '').trim();
    const code = entry.system === 'ICD' ? raw.toUpperCase() : raw;
    const result = (eligible, reason) => ({
      eligible, status: eligible === true ? 'eligible' : eligible === 'review' ? 'review' : 'not-eligible', reason,
      system: entry.system, code, label: codingLabel({ ...entry, code }),
      policyStatus: skipPolicy ? 'Not checked (no patient selected)' : pol ? policyStatusOn(pol, date) : 'No policy',
    });
    if (!skipPolicy) {
      if (!pol) return result(false, M.noPolicy);
      if (date > pol.validTo) return result(false, M.expired);
      if (date < pol.validFrom) return result(false, M.notStarted);
    }
    if (entry.system === 'AYUSH') {
      if (!R.coverage.AYUSH) return result(false, M.ayushNotCovered);
      return code ? result(true, M.eligible) : result('review', M.reviewAyush);
    }
    if (entry.system === 'ICD' && icdEdition(code) && (!R.requireRecognisedCode || icdDescription(code))) {
      return R.coverage.ICD ? result(true, M.eligible) : result(false, M.icdNotCovered);
    }
    return result('review', M.review);
  }
  const canSeeMedical = (p) => !!p && ((currentPatient() === p) || !!access(currentDoctor(), p));
  // Eligibility of one stored entry (diagnosis, treatment or prescription). Returns null without access.
  function checkInsuranceEligibility(patientId, entryId) {
    const p = PATIENTS.get(patientId);
    if (!canSeeMedical(p)) return null;
    const e = p.history.find((x) => x.id === entryId && x.system) || p.meds.find((x) => x.id === entryId && x.system);
    return e ? evaluateEligibility(e, { policy: p.policy, date: e.date ?? e.start }) : null;
  }
  const insuranceEntries = (p) => p.history.filter((e) => e.system).sort((a, b) => b.date - a.date);
  function logEligibility(p, doc, detail) {
    p.accessLog.unshift({ time: now(), doctorId: doc.id, hospitalId: doc.hospitalId, method: 'Insurance eligibility check', detail });
  }
  const BADGE_TEXT = { eligible: ['✓', 'Eligible'], 'not-eligible': ['✕', 'Not eligible'], review: ['!', 'Needs review'] };
  const badge = (r) => `<span class="badge badge-${r.status}"><span aria-hidden="true">${BADGE_TEXT[r.status][0]}</span>${BADGE_TEXT[r.status][1]}</span>`;
  const eligBlock = (r) => `<div class="elig">${badge(r)}<p class="reason">${esc(r.reason)}</p></div>`;
  const resultText = (r) => `${r.label} → ${BADGE_TEXT[r.status][1]} (${r.reason})`;
  const rupees = (n) => '₹' + Number(n).toLocaleString('en-IN');

  function policyBlock(p) {
    const pol = p.policy;
    if (!pol) return `<div class="banner err" style="margin:.5rem 0 0">${esc(INSURANCE_RULES.messages.noPolicy)}</div>`;
    const status = policyStatusOn(pol, now());
    return `<dl class="kv"><dt>Insurer</dt><dd>${esc(pol.insurer)}</dd><dt>Policy number</dt><dd>${esc(pol.number)}</dd>
      <dt>Valid</dt><dd>${fmtDate(pol.validFrom)} to ${fmtDate(pol.validTo)}</dd><dt>Sum insured</dt><dd>${rupees(pol.sumInsured)}</dd>
      <dt>Status</dt><dd><span class="badge badge-${status === 'Active' ? 'eligible' : 'not-eligible'}">${status}</span></dd></dl>`;
  }
  // Counts of eligibility results, e.g. "✓ 3 eligible · ✕ 1 not eligible".
  function resultCounts(results) {
    const n = { eligible: 0, 'not-eligible': 0, review: 0 };
    results.forEach((r) => { n[r.status] += 1; });
    return ['eligible', 'not-eligible', 'review'].filter((k) => n[k])
      .map((k) => `<span class="badge badge-${k}"><span aria-hidden="true">${BADGE_TEXT[k][0]}</span>${n[k]} ${BADGE_TEXT[k][1].toLowerCase()}</span>`).join(' ');
  }
  function policyLine(p) {
    const pol = p.policy;
    if (!pol) return `<p class="badge badge-not-eligible">${esc(INSURANCE_RULES.messages.noPolicy)}</p>`;
    const status = policyStatusOn(pol, now());
    return `<p class="policy-line"><strong>${esc(pol.insurer)}</strong> · ${esc(pol.number)} · ${fmtDate(pol.validFrom)} to ${fmtDate(pol.validTo)} · ${rupees(pol.sumInsured)}
      <span class="badge badge-${status === 'Active' ? 'eligible' : 'not-eligible'}">${status}</span></p>`;
  }
  function insuranceCard(p, id = 'p-insurance') {
    const groups = new Map();
    for (const e of insuranceEntries(p)) {
      const k = e.visit || e.id;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(e);
    }
    const SHOWN = 3; // latest visits shown; the rest behind "Show all"
    const all = [];
    const visits = [...groups.values()];
    const body = visits.map((list, gi) => `<tbody class="ins-visit${gi >= SHOWN ? ' ins-extra' : ''}">${list.map((e, i) => {
      const r = checkInsuranceEligibility(p.abha, e.id);
      all.push(r);
      const visit = i ? '' : `<td rowspan="${list.length}" class="small">${fmtDate(e.date)}<br>${hospTag(e.hospitalId)}${list.length > 1 ? `<br><span class="muted">One visit, ${list.length} entries</span>` : ''}</td>`;

      ? `<button class="btn btn-ghost btn-sm" data-action="ins-more" aria-expanded="false">Show all ${visits.length} visits</button>` : '';

      <div class="table-wrap"><table class="ins-table"><thead><tr><th>Visit</th><th>Entry</th><th>Code</th><th>Result</th></tr></thead>${body}</table></div>${more}` : empty('No coded entries yet.')}
      <p class="small muted" style="margin-top:.75rem">${esc(INSURANCE_RULES.note)}</p></section>`;
  }
  // Code column: the code on its own line, its meaning in small text underneath.
  function codeCell(e) {
    if (e.system === 'AYUSH') return `<strong>${esc(e.code || 'Not named')}</strong><br><span class="small muted">AYUSH · ${esc(e.ayushSystem || '')}</span>`;
    if (!e.code) return '<span class="muted">No code yet</span>';
    return `<strong>${esc(e.code)}</strong> <span class="small muted">${esc(icdEdition(e.code) || 'ICD')}</span><br><span class="small muted">${esc(icdDescription(e.code) || 'Unrecognised code')}</span>`;
  }

  // Hospital view: policy status and eligibility counts for entries made at THIS hospital only.
  // No diagnosis, code, treatment or other hospital's data.
  function hospitalInsuranceCard(h, patientsHere) {
    const rows = patientsHere.map((p) => {
      const results = p.history.filter((e) => e.system && e.hospitalId === h.id)
        .map((e) => evaluateEligibility(e, { policy: p.policy, date: e.date }));
      const pol = p.policy;
      const status = pol ? policyStatusOn(pol, now()) : null;
      return `<tr><td><strong>${esc(p.name)}</strong></td>
        <td>${pol ? `${esc(pol.insurer)}<br><span class="small muted">${esc(pol.number)} · until ${fmtDate(pol.validTo)}</span>` : '<span class="muted">No policy on file</span>'}</td>
        <td>${status ? `<span class="badge badge-${status === 'Active' ? 'eligible' : 'not-eligible'}">${status}</span>` : '—'}</td>
        <td>${results.length ? resultCounts(results) : '<span class="small muted">No coded entries here</span>'}</td></tr>`;
    }).join('');
    return `<section class="card a-violet" aria-labelledby="h-hins"><h2 id="h-hins">Insurance</h2>
      <p class="small muted">Policy status and claim eligibility for entries made at ${esc(h.short)}. Diagnoses, codes and treatments are not shown.</p>
      <div class="table-wrap" style="margin-top:.5rem"><table class="ins-table"><thead><tr><th>Patient</th><th>Insurer</th><th>Policy</th><th>Eligibility at ${esc(h.short)}</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <p class="small muted" style="margin-top:.75rem">${esc(INSURANCE_RULES.note)}</p></section>`;
  }
  function codingFields(p, { kind = 'prescribe', code = '' } = {}) {
    const preview = evaluateEligibility({ system: 'ICD', code }, { policy: p.policy, date: now() });
    return `<fieldset class="coding"${kind === 'note' ? ' hidden' : ''}><legend>Code for insurance</legend>
      <label>System<select name="system"><option value="ICD">ICD (modern medicine)</option><option value="AYUSH">AYUSH treatment</option><option value="NONE">No code yet</option></select></label>
      <label data-for="ICD">ICD code<span class="hint">ICD-10 like E11 or N39.0, or ICD-11 like 5A11</span><input name="code" list="icd-codes" autocomplete="off" value="${esc(code)}"></label>
      <div data-for="AYUSH" hidden><label>AYUSH system<select name="ayushSystem">${INSURANCE_RULES.ayushSystems.map((s) => `<option>${esc(s)}</option>`).join('')}</select></label>
        <label>Treatment name<input name="treatment" placeholder="e.g. Panchakarma" autocomplete="off"></label></div>
      <p class="small" style="margin:1rem 0 0"><strong>Insurance eligibility (live)</strong></p><div class="elig-live" aria-live="polite">${eligBlock(preview)}</div>
      <p class="small muted">${esc(INSURANCE_RULES.note)}</p></fieldset>`;
  }
  // Reads the coding fields of a form. Returns { coding } or { error, field }.
  function readCoding(form, { lenient = false } = {}) {
    const sys = form.elements.system.value;
    if (sys === 'NONE') return { coding: { system: 'ICD', code: '' } };
    if (sys === 'AYUSH') {
      const t = val(form, 'treatment');
      if (!t && !lenient) return { error: 'Enter the AYUSH treatment name.', field: 'treatment' };
      return { coding: { system: 'AYUSH', ayushSystem: form.elements.ayushSystem.value, code: t } };
    }
    const code = val(form, 'code').toUpperCase();
    if (!code && !lenient) return { error: 'Enter the ICD code, or choose "No code yet".', field: 'code' };
    if (code && !icdEdition(code)) return { error: icdFormatError(code), field: 'code' };
    return { coding: { system: 'ICD', code } };
  }
  const icdDatalist = () => `<datalist id="icd-codes">${Object.entries(ICD_CODES).map(([c, d]) => `<option value="${esc(c)}">${esc(d)}</option>`).join('')}</datalist>`;

  /* ---------- clinical summary (codes, formulations and alerts come from the NamaSetu API) ---------- */
  // The portal reads NamaSetu's reference endpoints with the sandbox clinician account, the same account the
  // NamaSetu site opens with. Portal records themselves never leave the browser except the salt names screened.
  const API = '/api';
  const API_DEMO = { username: 'clinician', password: 'Clinician@NamaSetu1' };
  let apiToken = null;
  let apiSignIn = null;
  async function api(path, body, retry = true) {
    if (!apiToken) {
      apiSignIn ??= fetch(`${API}/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(API_DEMO) })
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`sign-in failed (HTTP ${r.status})`))))
        .then((j) => { apiToken = j.access_token; })
        .finally(() => { apiSignIn = null; });
      await apiSignIn;
    }
    const r = await fetch(API + path, {
      method: body ? 'POST' : 'GET',
      headers: { Accept: 'application/json', Authorization: `Bearer ${apiToken}`, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (r.status === 401 && retry) { apiToken = null; return api(path, body, false); }
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  const SEV_RANK = { major: 0, moderate: 1, minor: 2 };
  const REL = { equivalent: 'Equivalent', wider: 'Broader', narrower: 'Narrower', relatedto: 'Related to (not an exact equivalent)' };
  const medLabel = (m) => `${m.brand} (${HOSPITALS[m.hospitalId].short})`;
  const summaryKey = (p) => `${p.abha}|${(p.ayushDx || {}).code || ''}|${p.meds.filter((m) => m.status === 'active').map((m) => m.id).join(',')}`;
  const summaryJobs = new Map(); // key -> Promise
  const summaryDone = new Map(); // key -> { data } | { error }

  function loadSummary(p) {
    const key = summaryKey(p);
    if (!summaryJobs.has(key)) {
      const job = (async () => {
        if (!p.ayushDx) return { map: null, formulations: [], screen: null };
        const code = encodeURIComponent(p.ayushDx.code);
        const [map, byc] = await Promise.all([
          api('/map', { code: p.ayushDx.code, top_k: 1 }),
          api(`/medications/by-condition?system=namaste&code=${code}`),
        ]);
        const formulations = byc.ayush.map((l) => ({ ...l.medication, link: l.link }));
        const active = p.meds.filter((m) => m.status === 'active').map((m) => ({ label: medLabel(m), salts: m.salts.map((s) => s.name) }));
        const screen = formulations.length
          ? await api('/medications/screen', { candidate_codes: formulations.map((f) => f.code), active })
          : null;
        return { map, formulations, screen };
      })();
      job.then((data) => summaryDone.set(key, { data }), (error) => { summaryDone.set(key, { error }); summaryJobs.delete(key); });
      summaryJobs.set(key, job);
    }
    return summaryJobs.get(key);
  }

  function medsSummaryTable(p, st) {
    const active = p.meds.filter((m) => m.status === 'active');
    const alerts = (st.data && st.data.screen && st.data.screen.alerts) || [];
    const rows = active.map((m) => {
      const label = medLabel(m);
      const herb = alerts.filter((a) => a.other_medication === label).sort((a, b) => SEV_RANK[a.severity] - SEV_RANK[b.severity]);
      const dup = active.filter((o) => o !== m && o.salts.some((s) => m.salts.some((x) => x.name.toLowerCase() === s.name.toLowerCase())));
      const allergy = allergyHits(p, m.salts);
      let screenCell;
      if (herb[0]) screenCell = `<span class="sev sev-${herb[0].severity}">${esc(herb[0].severity)} herb–drug</span>${herb.length > 1 ? ` <span class="small">+${herb.length - 1}</span>` : ''}`;
      else if (allergy.length) screenCell = '<span class="sev sev-major">Allergy conflict</span>';
      else if (dup.length) screenCell = `<span class="sev sev-moderate">Duplicate salt</span><div class="small muted">with ${esc(dup.map((d) => d.brand).join(', '))}</div>`;
      else if (st.status === 'loading') screenCell = '<span class="small muted">Screening…</span>';
      else if (st.status === 'error') screenCell = '<span class="small muted">Not screened (NamaSetu API unavailable)</span>';
      else if (!p.ayushDx || !(st.data && st.data.screen)) screenCell = '<span class="small muted">No AYUSH formulation to screen</span>';
      else if (m.salts.some((s) => st.data.screen.unresolved_salts.includes(s.name))) screenCell = '<span class="small muted">Not screened: salt not in NamaSetu\'s catalogue</span>';
      else screenCell = '<span class="small">No alert in loaded data*</span>';
      const indication = m.system === 'AYUSH' ? `AYUSH · ${esc(m.code)}` : m.code ? `${esc(icdDescription(m.code) || 'Unrecognised code')} <span class="small muted">${esc(m.code)}</span>` : '<span class="muted">Not coded</span>';
      return `<tr><td><strong>${esc(m.brand)}</strong><br><span class="small muted">${esc(HOSPITALS[m.hospitalId].short)} · ${esc(DOCTOR[m.doctorId].name)}</span></td>
        <td>${m.salts.map((s) => `<span class="salt-chip">${esc(s.name)}</span>`).join('')}</td>
        <td class="small">${esc(strengths(m))}<br>${esc(m.dose)}, ${esc(m.frequency)}<br><span class="muted">${esc(m.duration)}</span></td>
        <td><span class="tag">${m.system === 'AYUSH' ? 'AYUSH' : 'Allopathy'}</span></td>
        <td class="small">${indication}</td>
        <td>${screenCell}</td></tr>`;
    }).join('');
    return `<section class="card a-sky" aria-labelledby="h-csmeds"><h2 id="h-csmeds">Current medicines &amp; active chemical salts <span class="small muted" style="font-weight:400">from the prescription history</span></h2>
      ${active.length ? `<div class="table-wrap"><table class="cs-table"><thead><tr><th>Brand / formulation</th><th>Active chemical salt</th><th>Regimen</th><th>Domain</th><th>Clinical indication</th><th>Interaction screen</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="small muted" style="margin-top:.5rem">Regimen as prescribed in the record. Herb–drug alerts come from NamaSetu's cited interaction dataset. *Absence of data is not proof of safety.</p>` : empty('No current medicines.')}</section>`;
  }

  function herbDrugCard(p, st) {
    let inner;
    let tone = '';
    if (!p.ayushDx) inner = '<p class="muted">No AYUSH diagnosis recorded, so no formulation to screen.</p>';
    else if (st.status === 'loading') inner = '<p class="muted">Screening the approved formulations against current medicines…</p>';
    else if (st.status === 'error') inner = `<p class="muted">The NamaSetu API is not reachable (${esc(st.error.message)}). The rest of the record still works.</p>`;
    else if (!st.data.screen) inner = '<p class="muted">No approved AYUSH formulation for this diagnosis, so nothing to screen.</p>';
    else {
      const alerts = [...st.data.screen.alerts].sort((a, b) => SEV_RANK[a.severity] - SEV_RANK[b.severity]);
      const top = alerts[0];
      if (!top) inner = `<p>${esc(st.data.screen.message)}</p>`;
      else {
        tone = top.severity === 'major' || top.severity === 'moderate' ? ` alert-box ${top.severity}` : '';
        inner = `<p class="small"><strong>Triggered by:</strong> ${esc(top.other_medication)}</p>
          <p style="font-size:1.1rem;font-weight:700;margin-top:.4rem"><span class="sev sev-${top.severity}">${esc(top.severity)}</span> ${esc(top.agents.join(' × '))}</p>
          <p>${esc(top.mechanism)}</p>
          ${top.management_note ? `<p><strong>Clinical recommendation (from source):</strong> ${esc(top.management_note)}</p>` : ''}
          <p class="mono">${esc(top.path)}</p>
          <p class="small muted">Evidence: ${esc(top.evidence_level || 'not stated')} · Source: ${esc(top.citation)}${top.dataset ? ` · ${esc(top.dataset)}` : ''}</p>
          ${alerts.length > 1 ? `<details><summary>All alerts (${alerts.length})</summary><ul class="list">${alerts.map((a) => `<li><span class="sev sev-${a.severity}">${esc(a.severity)}</span> ${esc(a.agents.join(' × '))} <span class="small muted">with ${esc(a.other_medication)}</span><br><span class="small">${esc(a.mechanism)}</span></li>`).join('')}</ul></details>` : ''}
          <p class="small muted">${esc(st.data.screen.message)}</p>`;
      }
      if (st.data.screen.unresolved_salts.length) inner += `<p class="small muted">Not in NamaSetu's catalogue, so not screened: ${esc(st.data.screen.unresolved_salts.join(', '))}.</p>`;
    }
    return `<section class="card${tone}" aria-labelledby="h-hdi"><h2 id="h-hdi">High-priority herb–drug interaction</h2>${inner}</section>`;
  }

  function selectedDiagnosisCard(p, st, canEdit) {
    const f = st.data ? st.data.formulations : [];
    return `<section class="card a-teal" aria-labelledby="h-sdx"><h2 id="h-sdx">Selected diagnosis</h2>
      <dl class="kv"><dt>AYUSH (NAMASTE)</dt><dd>${p.ayushDx ? `${esc(p.ayushDx.display)} <span class="mono">${esc(p.ayushDx.code)}</span>` : '<span class="muted">Not recorded</span>'}</dd>
      <dt>ICD</dt><dd>${esc(p.diagnosis)}${p.dxCode && p.dxCode.code ? ` <span class="mono">${esc(p.dxCode.code)}</span>` : ''}</dd></dl>
      ${canEdit ? `<label>${p.ayushDx ? 'Change' : 'Add'} AYUSH diagnosis<span class="hint">Search NAMASTE in English, IAST or Devanagari</span>
        <input data-cs-search="${esc(p.abha)}" autocomplete="off" placeholder="Amavata, आमवात, Madhumeha…"></label><div class="cs-results" aria-live="polite"></div>` : ''}
      ${p.ayushDx ? `<h3 style="margin-top:1rem">Approved AYUSH formulations screened</h3>
        ${st.status === 'loading' ? '<p class="muted small">Loading…</p>' : f.length ? `<ul class="list">${f.map((m) => `<li><strong>${esc(m.name)}</strong> <span class="mono">${esc(m.code)}</span><br><span class="small muted">Contains ${esc(m.composition.map((c) => c.canonical_name).join(', '))} · source: ${esc(m.link.source.title)}</span></li>`).join('')}</ul>` : '<p class="muted small">None approved for this diagnosis.</p>'}
        <p class="small"><strong>Reference only — not a prescription. Consult a qualified clinician.</strong></p>` : ''}</section>`;
  }

  function crosswalkCard(p, st) {
    let inner;
    let chip = '';
    if (!p.ayushDx) inner = '<p class="muted">Record an AYUSH diagnosis to see its WHO ICD-11 mapping.</p>';
    else if (st.status === 'loading') inner = '<p class="muted">Mapping…</p>';
    else if (st.status === 'error') inner = '<p class="muted">The NamaSetu API is not reachable, so the mapping cannot be shown.</p>';
    else {
      const c = st.data.map.candidates[0];
      if (!c) inner = `<p>${esc(st.data.map.message)}</p>`;
      else {
        chip = `<span class="tag tag-strong mono">Confidence ${c.confidence.toFixed(2)} · ${esc(c.band)} band</span>`;
        const bio = c.biomedicine;
        inner = `<div class="tiles">
          <div class="tile tile-namaste"><p class="eyebrow">NAMASTE standard</p><p class="code">${esc((c.namaste || {}).code || '')}</p><p><strong>${esc((c.namaste || {}).display || '')}</strong></p><p class="small">${esc((st.data.map.resolved || {}).devanagari || 'Ayush terminology')}</p></div>
          <div class="tile tile-who"><p class="eyebrow">WHO ICD-11 (TM2)</p><p class="code">${esc(c.tm2.code)}</p><p><strong>${esc(c.tm2.display)}</strong></p><p class="small">From NAMASTE: ${esc(REL[c.relationship] || c.relationship)}</p></div>
          <div class="tile tile-bio"><p class="eyebrow">Biomedical equivalent</p>${bio.code ? `<p class="code">${esc(bio.code)}</p><p><strong>${esc(bio.display)}</strong></p><p class="small">From TM2: ${esc(REL[bio.relationship] || bio.relationship)} · ${bio.source === 'who-index' ? 'WHO index' : esc(bio.source)} · ${esc(bio.status)}</p>` : `<p class="small" style="margin-top:.6rem">${esc(bio.message || 'No approved biomedical link.')}</p>`}</div>
        </div>
        ${c.band !== 'high' || st.data.map.status !== 'suggested' ? '<div class="banner warn" style="margin:1rem 0 0">Needs clinician review: a mapping below the high band is never recorded without a clinician decision.</div>' : ''}
        <div class="banner info" style="margin:1rem 0 0"><p class="eyebrow">Clinical rationale (why the engine matched)</p><p>${esc(c.reasoning)}</p></div>
        <p class="small muted" style="margin-top:.5rem">${c.tm2.code.startsWith('SAMPLE-') ? 'SAMPLE — illustrative, not official codes. ' : ''}Datasets: ${esc(st.data.map.dataset_releases.join(', '))}</p>`;
      }
    }
    return `<section class="card a-indigo" aria-labelledby="h-xw"><div class="row"><div><h2 id="h-xw" style="margin:0">Interoperability cross-walk</h2><p class="small muted">Three-way mapping across AYUSH and WHO terminology</p></div>${chip}</div>${inner}</section>`;
  }

  function clinicalSummaryInner(p, canEdit) {
    const done = summaryDone.get(summaryKey(p));
    const st = !done ? { status: 'loading' } : done.error ? { status: 'error', error: done.error } : { status: 'ready', data: done.data };
    return `${medsSummaryTable(p, st)}<div class="cs-grid2">${herbDrugCard(p, st)}${selectedDiagnosisCard(p, st, canEdit)}</div>${crosswalkCard(p, st)}`;
  }
  function clinicalSummary(p, canEdit, id = 'p-summary') {
    return `<div id="${id}" class="stack" data-cs="${esc(p.abha)}" data-cs-edit="${canEdit ? '1' : ''}">${clinicalSummaryInner(p, canEdit)}</div>`;
  }
  // After a render: fetch what is missing, then refresh only the summary (forms elsewhere keep their input).
  function hydrateSummary() {
    const box = document.querySelector('[data-cs]');
    if (!box) return;
    const p = PATIENTS.get(box.dataset.cs);
    if (!p || summaryDone.has(summaryKey(p))) return;
    loadSummary(p).catch(() => {}).finally(() => {
      const el = document.querySelector(`[data-cs="${CSS.escape(p.abha)}"]`);
      if (el && canSeeMedical(p)) el.innerHTML = clinicalSummaryInner(p, !!el.dataset.csEdit);
    });
  }

  /* ---------- shared UI pieces ---------- */
  const hospTag = (hid) => `<span class="tag tag-strong">${esc(HOSPITALS[hid].short)}</span>`;
  const empty = (text) => `<p class="empty">${esc(text)}</p>`;
  const sessionName = () => {
    if (!session) return '';
    if (session.role === 'patient') return PATIENTS.get(session.id).name;
    if (session.role === 'doctor') return DOCTOR[session.id].name;
    return HOSPITALS[session.id].name;
  };
  const homeHash = () => (session ? `#/${session.role}` : '#/');

  function profileCard(p) {
    return `<section class="card a-sky" id="p-profile" aria-labelledby="h-profile"><h2 id="h-profile">Profile</h2>
      <dl class="kv"><dt>Name</dt><dd>${esc(p.name)}</dd><dt>Age</dt><dd>${p.age}</dd><dt>Gender</dt><dd>${esc(p.gender)}</dd>
      <dt>ABHA ID</dt><dd>${esc(p.abha)}</dd><dt>Blood group</dt><dd>${esc(p.blood)}</dd>
      <dt>Allergies</dt><dd>${p.allergies.length ? p.allergies.map(esc).join(', ') : 'None recorded'}</dd>
      <dt>Hospitals visited</dt><dd>${hospitalsVisited(p).map((h) => `${esc(h.short)} (${esc(h.name)})`).join('<br>')}</dd></dl></section>`;
  }
  const diagnosisCard = (p) => `<section class="card a-teal" aria-labelledby="h-dx"><h2 id="h-dx">Current diagnosis</h2><p style="font-size:1.15rem;font-weight:650">${esc(p.diagnosis)}</p>${p.dxCode ? `<p class="code-line">${esc(codingLabel(p.dxCode))}</p>` : ''}</section>`;

  function sideEffects(m) {
    const s = m.se;
    if (!s) return '<p class="small muted">No side-effect notes in the demo catalogue. Ask the prescribing doctor.</p>';
    const list = (xs) => (xs && xs.length ? `<ul>${xs.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="small muted">None listed.</p>');
    return `<div class="se"><h4>Common</h4>${list(s.common)}<h4>Serious</h4>${list(s.serious)}${s.contact ? `<h4>Contact your doctor if</h4><p>${esc(s.contact)}</p>` : ''}</div>`;
  }
  function medCard(m, opts = {}) {
    const fresh = isNewMed(m);
    return `<article class="med${fresh ? ' is-new' : ''}">
      <div class="row"><h3 style="margin:0">${esc(m.brand)} ${fresh ? '<span class="tag tag-new">New</span>' : ''}</h3>${hospTag(m.hospitalId)}</div>
      <p class="salt">${esc(composition(m))}</p>${m.system ? `<p class="code-line">For: ${esc(codingLabel(m))}</p>` : ''}
      <dl class="kv"><dt>Dose</dt><dd>${esc(m.dose)}</dd><dt>Frequency</dt><dd>${esc(m.frequency)}</dd><dt>Duration</dt><dd>${esc(m.duration)}</dd></dl>
      <p class="meta">${fresh ? 'Newly prescribed' : 'Prescribed'} on ${fmtDate(m.start)} by ${esc(DOCTOR[m.doctorId].name)}, ${esc(HOSPITALS[m.hospitalId].name)}</p>
      <details><summary>Side effects</summary>${sideEffects(m)}</details>
      ${opts.stop ? `<div class="form-actions"><button class="btn btn-danger btn-sm" data-action="stop-med" data-abha="${esc(opts.abha)}" data-id="${m.id}">Stop this medicine</button></div>` : ''}
    </article>`;
  }
  function newMedsCard(list) {
    return `<section class="card a-teal" aria-labelledby="h-new"><h2 id="h-new">Newly prescribed <span class="tag tag-new">New</span></h2>
      ${list.length ? list.map((m) => `<p><strong>${esc(m.brand)}</strong> (${esc(composition(m))}) · ${fmtDate(m.start)} · ${esc(DOCTOR[m.doctorId].name)}, ${esc(HOSPITALS[m.hospitalId].short)}</p>`).join('') : empty('No new medicines in the last 30 days.')}</section>`;
  }
  function medsCard(active, opts = {}) {
    return `<section class="card a-teal" id="p-meds" aria-labelledby="h-meds"><h2 id="h-meds">Current medicines</h2>
      ${active.length ? active.map((m) => medCard(m, opts)).join('') : empty('No current medicines.')}</section>`;
  }
  function timelineCard(p) {
    const items = [...p.history].sort((a, b) => b.date - a.date);
    return `<section class="card a-indigo" id="p-history" aria-labelledby="h-history"><h2 id="h-history">History across hospitals</h2>
      <p class="small muted">Every entry shows the hospital and doctor that created it.</p>
      ${items.length ? `<ol class="timeline">${items.map((h) => `<li>
        <p class="small muted">${fmtDate(h.date)} · <span class="tag">${esc(h.type)}</span> ${hospTag(h.hospitalId)}</p>
        <p><strong>${esc(h.title)}</strong></p><p>${esc(h.details)}</p>
        ${h.system ? (() => { const r = checkInsuranceEligibility(p.abha, h.id); return `<p class="code-line">${esc(r.label)} ${badge(r)}</p>`; })() : ''}
        <p class="small muted">${esc(DOCTOR[h.doctorId].name)}, ${esc(HOSPITALS[h.hospitalId].name)}</p>
        ${h.snapshot ? `<button class="btn btn-ghost btn-sm" data-action="view-final" data-abha="${esc(p.abha)}" data-id="${h.id}">View final report</button>` : ''}
      </li>`).join('')}</ol>` : empty('No history yet.')}</section>`;
  }
  function reportsCard(p, { owner }) {
    const rows = [...p.reports].sort((a, b) => b.date - a.date);
    const upload = owner ? `<form data-form="upload" class="no-print" novalidate>
        <h3 style="margin-top:1rem">Upload a report</h3>
        <label>File (PDF or image, up to 5 MB)<input type="file" name="file" accept="application/pdf,image/*" required></label>
        <div class="row2">
          <label>Report type<select name="type" required><option value="">Choose…</option>${['Blood test', 'Urine test', 'Imaging (X-ray, scan)', 'ECG', 'Discharge summary', 'Prescription', 'Other'].map((t) => `<option>${t}</option>`).join('')}</select></label>
          <label>Report date<input type="date" name="date" max="${isoDay(Date.now())}" required></label>
        </div>
        <label>Lab or hospital name<input name="lab" autocomplete="off" required></label>
        <p class="form-error" role="alert" hidden></p>
        <div class="form-actions"><button class="btn btn-primary">Upload report</button></div>
      </form>` : '<p class="small muted">Read-only: reports can be viewed and downloaded, not changed.</p>';
    return `<section class="card a-violet" id="p-reports" aria-labelledby="h-reports"><h2 id="h-reports">Reports</h2>
      ${rows.length ? `<ul class="list">${rows.map((r) => `<li>
        <p><strong>${esc(r.type)}</strong> · ${fmtDate(r.date)}</p>
        <p class="small muted">${esc(r.lab)} · ${esc(r.fileName)}${r.uploadedBy === 'patient' ? ' · uploaded by patient' : ''}</p>
        <div class="form-actions" style="margin-top:.5rem">
          <button class="btn btn-ghost btn-sm" data-action="preview-report" data-abha="${esc(p.abha)}" data-id="${r.id}">Preview</button>
          <button class="btn btn-ghost btn-sm" data-action="download-report" data-abha="${esc(p.abha)}" data-id="${r.id}">Download</button>
          ${owner && r.uploadedBy === 'patient' ? `<button class="btn btn-danger btn-sm" data-action="delete-report" data-id="${r.id}">Delete</button>` : ''}
        </div></li>`).join('')}</ul>` : empty('No reports uploaded yet.')}
      ${upload}</section>`;
  }

  const INSURANCE_CASES = {
    '99-1001-2001-3001': 'Eligible (ICD, active policy)',
    '99-1002-2002-3002': 'One visit with ICD (eligible) + AYUSH yoga (not eligible)',
    '99-1003-2003-3003': 'Policy expired',
    '99-1004-2004-3004': 'No policy on file',
    '99-1005-2005-3005': 'Entry with no code: needs review',
    '99-1006-2006-3006': 'AYUSH Panchakarma (not eligible) + ICD (eligible)',
  };
  function credentialsPanel(open = false) {
    const use = (role, id, secret) => `<button class="btn btn-ghost btn-sm" data-action="fill" data-role="${role}" data-id="${esc(id)}" data-secret="${esc(secret)}">Use</button>`;
    return `<details class="card creds no-print"${open ? ' open' : ''}><summary>Demo credentials (fictional)</summary>
      <h3>Hospitals</h3><div class="table-wrap"><table><thead><tr><th>Hospital</th><th>Registration ID</th><th>Password</th><th></th></tr></thead><tbody>
      ${Object.values(HOSPITALS).map((h) => `<tr><td>${esc(h.short)} · ${esc(h.name)}</td><td>${esc(h.regId)}</td><td>${esc(h.password)}</td><td>${use('hospital', h.regId, h.password)}</td></tr>`).join('')}</tbody></table></div>
      <h3>Doctors <span class="small muted">(sign in with the HPR ID or the ABHA ID)</span></h3><div class="table-wrap"><table><thead><tr><th>Doctor</th><th>Hospital</th><th>HPR ID</th><th>ABHA ID</th><th>Password</th><th></th></tr></thead><tbody>
      ${DOCTORS.map((d) => `<tr><td>${esc(d.name)}<br><span class="small muted">${esc(d.spec)}</span></td><td>${esc(HOSPITALS[d.hospitalId].short)}</td><td>${esc(d.hprId)}</td><td>${esc(d.abha)}</td><td>${esc(d.password)}</td><td>${use('doctor', d.hprId, d.password)}</td></tr>`).join('')}</tbody></table></div>
      <h3>Patients <span class="small muted">(OTP for every patient: ${DEMO_OTP})</span></h3><div class="table-wrap"><table><thead><tr><th>Patient</th><th>ABHA ID</th><th>Hospitals visited</th><th>Insurance test case</th><th></th></tr></thead><tbody>
      ${[...PATIENTS.values()].map((p) => `<tr><td>${esc(p.name)}</td><td>${esc(p.abha)}</td><td>${hospitalsVisited(p).map((h) => esc(h.short)).join(' + ')}</td><td class="small">${esc(INSURANCE_CASES[p.abha] || '')}</td><td>${use('patient', p.abha, DEMO_OTP)}</td></tr>`).join('')}</tbody></table></div>
    </details>`;
  }

  /* ---------- views ---------- */
  function viewLanding() {
    const card = (role, title, text, how) => `<section class="card portal" aria-labelledby="pc-${role}"><h2 id="pc-${role}">${title}</h2><p class="muted">${text}</p><p class="small"><strong>Sign in with:</strong> ${how}</p><a class="btn btn-primary btn-block" href="#/login/${role}">${title} sign-in</a></section>`;
    return `<section class="hero"><p class="eyebrow">NamaSetu Care Portal · demo</p><h1>One ABHA ID. Every hospital.</h1>
      <p class="lead">A patient's record belongs to their ABHA ID, not to a hospital. Doctors see it when the patient is assigned to them, or for 30 minutes after the patient shares a QR token or a consent OTP. Hospitals see their doctors and patient names, never medical details.</p></section>
      ${session ? `<div class="banner ok">Signed in as <strong>${esc(sessionName())}</strong> (${ROLE_LABEL[session.role]}). <a class="link" href="${homeHash()}">Open your dashboard</a></div>` : ''}
      <div class="grid cards3">
        ${card('hospital', 'Hospital', 'For hospital administrators: your hospital profile, your doctors and the names of their patients. No medical data.', 'Hospital registration ID and password')}
        ${card('doctor', 'Doctor', 'Your patients, temporary access through a QR token or consent OTP, prescriptions and final reports.', 'ABHA ID or HPR ID and password')}
        ${card('patient', 'Patient', 'Your own record from every hospital: medicines, side effects, history, reports, QR code and who opened your record.', 'ABHA ID and a one-time password (OTP)')}      </div>${credentialsPanel()}`;
  }

  function viewLogin(role) {
    const fill = prefill && prefill.role === role ? prefill : null;
    prefill = null;
    const v = (x) => (fill ? esc(x) : '');
    const fields = {
      patient: `<label>ABHA ID<span class="hint">Format XX-XXXX-XXXX-XXXX</span><input name="id" inputmode="numeric" autocomplete="username" placeholder="99-1001-2001-3001" value="${v(fill && fill.id)}" required></label>
        <label>OTP<span class="hint">Demo OTP: ${DEMO_OTP}</span><input name="secret" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="${v(fill && fill.secret)}" required></label>`,
      doctor: `<label>ABHA ID or HPR ID<input name="id" autocomplete="username" placeholder="HPR-DEMO-1101" value="${v(fill && fill.id)}" required></label>
        <label>Password<input name="secret" type="password" autocomplete="current-password" value="${v(fill && fill.secret)}" required></label>`,
      hospital: `<label>Hospital registration ID<input name="id" autocomplete="username" placeholder="HFR-DEMO-A-1001" value="${v(fill && fill.id)}" required></label>
        <label>Password<input name="secret" type="password" autocomplete="current-password" value="${v(fill && fill.secret)}" required></label>`,
    }[role];
    return `<div class="narrow"><p><a class="link" href="#/">← All portals</a></p>
      <section class="card"><p class="eyebrow">${ROLE_LABEL[role]} portal</p><h1>${ROLE_LABEL[role]} sign-in</h1>
      ${session && session.role !== role ? `<p class="small muted">You are signed in as ${esc(sessionName())}. Signing in here ends that session.</p>` : ''}
      <form data-form="login" data-role="${role}" novalidate>${fields}
        <p class="form-error" role="alert" hidden></p>
        <div class="form-actions"><button class="btn btn-primary btn-block">Sign in</button></div></form></section>
      ${credentialsPanel()}</div>`;
  }

  // Hospital pages: only this hospital's doctors and the NAMES of their patients. Never diagnoses or other medical data.
  const hospitalDoctors = (h) => DOCTORS.filter((d) => d.hospitalId === h.id);
  const patientNamesOf = (d) => [...PATIENTS.values()].filter((p) => p.assigned.includes(d.id)).map((p) => p.name).sort();

  // Dashboard header: initials, eyebrow, name, one line of context and an optional note.
  const initials = (name) => name.replace(/^Dr\.?\s+/i, '').split(/\s+/).slice(0, 2).map((w) => w[0] || '').join('').toUpperCase();
  const welcome = ({ eyebrow, title, sub = '', note = '', mark, action = '' }) => `<div class="welcome"><div class="avatar" aria-hidden="true">${esc(mark ?? initials(title))}</div>
      <div class="who"><p class="eyebrow">${eyebrow}</p><h1>${esc(title)}</h1>${sub ? `<p class="muted" style="margin:.2rem 0 0">${sub}</p>` : ''}</div>${action}
      ${note ? `<p class="note">${note}</p>` : ''}</div>`;
  // Summary tiles; every number is computed from the records on this page.
  const stats = (items) => `<div class="stats" role="list" aria-label="Summary">${items.map(([n, label, accent]) => `<div class="stat a-${accent}" role="listitem"><span class="num">${esc(String(n))}</span><span class="lbl">${esc(label)}</span></div>`).join('')}</div>`;

  function viewHospital() {
    const h = currentHospital();
    const docs = hospitalDoctors(h);
    const rows = [...PATIENTS.values()]
      .map((p) => ({ name: p.name, docs: docs.filter((d) => p.assigned.includes(d.id)) }))
      .filter((r) => r.docs.length)
      .sort((a, b) => a.name.localeCompare(b.name));
    const here = [...PATIENTS.values()].filter((p) => docs.some((d) => p.assigned.includes(d.id)));
    const activePolicies = here.filter((p) => p.policy && policyStatusOn(p.policy, now()) === 'Active').length;
    return `${welcome({ eyebrow: `Hospital dashboard · ${esc(h.short)}`, title: h.name, sub: esc(h.address),
        note: "This dashboard shows your hospital, your doctors, the names of their patients and their insurance status. Diagnoses and other medical details stay in the patient's ABHA record." })}
      ${stats([[rows.length, 'Patients', 'sky'], [docs.length, 'Doctors', 'teal'], [activePolicies, 'Active insurance policies', 'violet'], [h.beds, 'Beds', 'indigo']])}
      <div class="grid grid-2">
          <section class="card a-sky" aria-labelledby="h-pts"><h2 id="h-pts">Patients (${rows.length})</h2>
            <label>Search patients or doctors<input data-filter="hosp" placeholder="Patient or doctor name" autocomplete="off"></label>
            <div class="table-wrap" style="margin-top:.75rem"><table><thead><tr><th>Patient</th><th>Doctor</th><th>Speciality</th></tr></thead><tbody id="hosp-rows">
            ${rows.map((r) => `<tr data-search="${esc((r.name + ' ' + r.docs.map((d) => d.name).join(' ')).toLowerCase())}"><td><strong>${esc(r.name)}</strong></td>
              <td>${r.docs.map((d) => `<a class="link" href="#/hospital/doctor/${d.id}">${esc(d.name)}</a>`).join('<br>')}</td><td>${r.docs.map((d) => esc(d.spec)).join('<br>')}</td></tr>`).join('')}
            </tbody></table></div><p class="empty" id="hosp-empty" hidden>No patient or doctor matches that search.</p></section>
          <section class="card a-teal" aria-labelledby="h-docs"><h2 id="h-docs">Doctors (${docs.length})</h2>
            <ul class="list">${docs.map((d) => { const names = patientNamesOf(d); return `<li><div class="row">
              <div><p><strong>${esc(d.name)}</strong> · ${esc(d.spec)}</p><p class="small muted">HPR ID ${esc(d.hprId)} · ${names.length} patient${names.length === 1 ? '' : 's'}</p></div>
              <a class="btn btn-ghost btn-sm" href="#/hospital/doctor/${d.id}">View details<span class="visually-hidden"> of ${esc(d.name)}</span></a></div></li>`; }).join('')}</ul></section>
      </div>
      <div class="section-gap">${hospitalInsuranceCard(h, [...here].sort((a, b) => a.name.localeCompare(b.name)))}</div>
      <div class="grid grid-2 section-gap">
          <section class="card a-indigo" aria-labelledby="h-add"><h2 id="h-add">Add new patient</h2>
            <p class="small muted">Registers the patient under their ABHA ID and assigns a doctor. The diagnosis is saved to the patient's record for the doctor and the patient. It is not shown on this dashboard.</p>
            <form data-form="register" novalidate>
              <div class="row2"><label>Full name<input name="name" autocomplete="off" required></label>
                <label>ABHA ID<span class="hint">XX-XXXX-XXXX-XXXX</span><input name="abha" inputmode="numeric" autocomplete="off" required></label></div>
              <div class="row2"><label>Age<input name="age" type="number" min="0" max="120" inputmode="numeric" required></label>
                <label>Gender<select name="gender" required><option value="">Choose…</option><option>Female</option><option>Male</option><option>Other</option></select></label></div>
              <div class="row2"><label>Blood group<select name="blood"><option value="">Not known</option>${['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'].map((g) => `<option>${g}</option>`).join('')}</select></label>
                <label>Allergies<span class="hint">Comma-separated, optional</span><input name="allergies" autocomplete="off"></label></div>
              <label>Doctor<select name="doctor" required><option value="">Choose a doctor…</option>${docs.map((d) => `<option value="${d.id}">${esc(d.name)} · ${esc(d.spec)}</option>`).join('')}</select></label>
              <div class="row2"><label>Diagnosis<input name="diagnosis" autocomplete="off" required></label>
                <label>ICD code<span class="hint">Optional, e.g. E11 or N39.0</span><input name="code" autocomplete="off"></label></div>
              <p class="form-error" role="alert" hidden></p>
              <div class="form-actions"><button class="btn btn-primary">Register patient</button></div></form></section>
          <section class="card a-sky" aria-labelledby="h-hosp"><h2 id="h-hosp">Hospital profile</h2>
            <dl class="kv"><dt>Name</dt><dd>${esc(h.name)}</dd><dt>Registration ID</dt><dd>${esc(h.regId)}</dd><dt>Address</dt><dd>${esc(h.address)}</dd>
            <dt>Contact</dt><dd>${esc(h.contact)}</dd><dt>Departments</dt><dd>${h.departments.map(esc).join(', ')}</dd><dt>Beds</dt><dd>${h.beds}</dd></dl></section>
      </div>`;
  }

  function viewHospitalDoctor(id) {
    const h = currentHospital();
    const d = DOCTOR[id];
    // A hospital can only open its own doctors.
    if (!d || d.hospitalId !== h.id) return `<div class="narrow"><section class="card"><h1>Doctor not found</h1><p>This doctor is not part of ${esc(h.name)}.</p>
      <div class="form-actions"><a class="btn btn-primary" href="#/hospital">Back to dashboard</a></div></section></div>`;
    const names = patientNamesOf(d);
    return `<p><a class="link" href="#/hospital">← Back to dashboard</a></p>
      <div class="page-head"><div><p class="eyebrow">Doctor details · ${esc(h.short)}</p><h1>${esc(d.name)}</h1><p class="muted">${esc(d.spec)} · ${esc(h.name)}</p></div></div>
      <div class="grid grid-2">
        <section class="card a-sky" aria-labelledby="h-dd"><h2 id="h-dd">Details</h2>
          <dl class="kv"><dt>Name</dt><dd>${esc(d.name)}</dd><dt>Speciality</dt><dd>${esc(d.spec)}</dd><dt>HPR ID</dt><dd>${esc(d.hprId)}</dd><dt>ABHA ID</dt><dd>${esc(d.abha)}</dd>
          <dt>Hospital</dt><dd>${esc(h.name)}</dd><dt>Room</dt><dd>${esc(d.room)}</dd><dt>OPD days</dt><dd>${esc(d.opd)}</dd><dt>Phone</dt><dd>${esc(d.phone)}</dd>
          <dt>Email</dt><dd>${esc(d.email)}</dd><dt>With hospital since</dt><dd>${d.joined}</dd></dl></section>
        <section class="card a-teal" aria-labelledby="h-dp"><h2 id="h-dp">Patients (${names.length})</h2><p class="small muted">Names only.</p>
          ${names.length ? `<ul class="list">${names.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : empty('No patients assigned.')}</section>
      </div>`;
  }

  function viewPatient() {
    const p = currentPatient();
    const active = p.meds.filter((m) => m.status === 'active');
    const qr = p.qrToken
      ? `<div class="qr-box"><div id="qr" role="img" aria-label="QR code containing your patient reference token"></div></div>
         <p class="small muted">Token (also shown as text for doctors who type it in):</p><code class="token">${esc(p.qrToken)}</code>`
      : '<div class="banner warn">No active QR token. Doctors cannot use a QR code to open your record until you generate a new one.</div>';
    const sections = [['p-summary', 'Clinical summary'], ['p-profile', 'Profile'], ['p-meds', 'Medicines'], ['p-insurance', 'Insurance'], ['p-history', 'History'], ['p-qr', 'QR code'], ['p-reports', 'Reports'], ['p-log', 'Access log']];
    return `${welcome({ eyebrow: 'Patient dashboard', title: p.name, sub: `ABHA ID ${esc(p.abha)} · your record travels with you to every hospital.` })}
      ${stats([[active.length, 'Active medicines', 'sky'], [hospitalsVisited(p).length, 'Hospitals visited', 'teal'], [p.reports.length, 'Reports', 'violet'], [p.accessLog.length, 'Times a doctor opened your record', 'indigo']])}
      <nav class="chips no-print" aria-label="Jump to section">${sections.map(([id, l]) => `<button class="chip" data-action="jump" data-target="${id}">${l}</button>`).join('')}</nav>
      <h2 class="visually-hidden">Clinical summary</h2>
      ${clinicalSummary(p, false)}
      <div class="grid grid-2 section-gap">
        <div class="stack">${profileCard(p)}${diagnosisCard(p)}${newMedsCard(active.filter(isNewMed))}</div>
        <div class="stack">
          <section class="card a-sky" id="p-qr" aria-labelledby="h-qr"><h2 id="h-qr">Your QR code</h2>
            <p class="small muted">The code holds only a random reference token, never medical data. A doctor must sign in to use it, and gets 30 minutes of read-only access. Every use appears in your access log.</p>
            ${qr}
            <div class="form-actions"><button class="btn btn-primary" data-action="qr-regenerate">${p.qrToken ? 'Regenerate token' : 'Generate new token'}</button>
            ${p.qrToken ? '<button class="btn btn-danger" data-action="qr-revoke">Revoke token</button>' : ''}</div>
            <p class="small muted">Regenerating or revoking stops the old token working immediately.</p></section>
        </div></div>
      <div class="grid grid-2 section-gap">
        <div class="stack">${medsCard(active)}</div>
        <div class="stack">${reportsCard(p, { owner: true })}</div></div>
      <div class="grid grid-2 section-gap">
        <div class="stack">${insuranceCard(p)}</div>
        <div class="stack">
          <section class="card a-indigo" id="p-log" aria-labelledby="h-log"><h2 id="h-log">Access log</h2><p class="small muted">Every time a doctor opened your record.</p>
            ${p.accessLog.length ? `<div class="table-wrap"><table><thead><tr><th>When</th><th>Doctor</th><th>Hospital</th><th>Method</th></tr></thead><tbody>
            ${p.accessLog.map((l) => `<tr><td>${fmtDateTime(l.time)}</td><td>${esc(DOCTOR[l.doctorId].name)}</td><td>${esc(HOSPITALS[l.hospitalId].short)}</td><td>${esc(l.method)}${l.detail ? `<br><span class="small muted">${esc(l.detail)}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>` : empty('No doctor has opened your record yet.')}</section>
        </div></div>
      <div class="section-gap">${timelineCard(p)}</div>`;
  }

  function viewDoctor() {
    const doc = currentDoctor();
    const h = HOSPITALS[doc.hospitalId];
    const mine = [...PATIENTS.values()].filter((p) => p.assigned.includes(doc.id));
    const latest = new Map();
    for (const g of grants) if (g.doctorId === doc.id && !PATIENTS.get(g.abha).assigned.includes(doc.id)) latest.set(g.abha, g);
    const shared = [...latest.values()].sort((a, b) => b.expiresAt - a.expiresAt);
    const liveShared = shared.filter((g) => g.expiresAt > now()).length;
    const activeRx = mine.reduce((n, p) => n + p.meds.filter((m) => m.status === 'active' && m.doctorId === doc.id).length, 0);
    return `${welcome({ eyebrow: `Doctor dashboard · ${esc(h.short)}`, title: doc.name, sub: `${esc(doc.spec)} · ${esc(h.name)}` })}
      ${stats([[mine.length, 'My patients', 'sky'], [liveShared, 'Temporary access (QR / consent)', 'teal'], [activeRx, 'Active prescriptions by me', 'violet'], [mine.reduce((n, p) => n + p.reports.length, 0), 'Reports on my patients', 'indigo']])}
      <div class="grid grid-2">
        <div class="stack">
          <section class="card a-sky" aria-labelledby="h-mine"><h2 id="h-mine">My patients (${mine.length})</h2>
            <label>Search my patients<input data-filter="mine" placeholder="Name, ABHA ID or diagnosis" autocomplete="off"></label>
            <ul class="list" id="mine-list" style="margin-top:.75rem">${mine.map((p) => `<li data-search="${esc((p.name + ' ' + p.abha + ' ' + p.diagnosis).toLowerCase())}"><div class="row">
              <div><p><strong>${esc(p.name)}</strong> · ${p.age} · ${esc(p.gender)}</p><p class="small muted">${esc(p.abha)} · ${esc(p.diagnosis)}</p></div>
              <a class="btn btn-ghost btn-sm" href="#/doctor/patient/${esc(p.abha)}">Open<span class="visually-hidden"> ${esc(p.name)}</span></a></div></li>`).join('')}</ul>
            <p class="empty" id="mine-empty" hidden>No patient matches that search.</p>
            ${mine.length ? '' : empty('No patients assigned yet.')}</section>
